name: Staging OTA Update

defaults:
  tools:
    bun: "1.3.14"

on:
  push:
    branches:
      - 'main'

jobs:
  quality_gate:
    name: Typecheck, Token Lint & Tests
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck, Token Lint & Tests
        run: |
          APP_DIR=$([ -d "apps/patient-app" ] && echo "apps/patient-app" || echo ".")
          [ -d "$APP_DIR/node_modules" ] || [ -d "node_modules" ] || [ -d "../../node_modules" ] || bun install --frozen-lockfile
          bun run --cwd "$APP_DIR" typecheck
          bun run --cwd "$APP_DIR" lint:tokens
          bun run --cwd "$APP_DIR" test

  update:
    name: Publish Staging
    needs: [quality_gate]
    type: update
    environment: preview
    params:
      channel: staging
