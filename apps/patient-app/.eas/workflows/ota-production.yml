name: Production OTA Update

defaults:
  tools:
    node: "24.22.1"
    bun: "1.3.14"

on:
  push:
    tags:
      - 'patient-app-v*'

jobs:
  quality_gate:
    name: Typecheck, Token Lint & Tests
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - name: Install Monorepo Dependencies & Run Quality Gates
        run: |
          REPO_ROOT=$(git rev-parse --show-toplevel)
          cd "$REPO_ROOT"
          bun install --frozen-lockfile
          bun run --cwd apps/patient-app typecheck
          bun run --cwd apps/patient-app lint:tokens
          bun run --cwd apps/patient-app test

  update:
    name: Publish Production
    needs: [quality_gate]
    type: update
    environment: production
    params:
      channel: production
