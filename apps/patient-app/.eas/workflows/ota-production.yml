name: Production Release Build & OTA Update

defaults:
  tools:
    node: "24.22.1"
    bun: "1.3.14"

on:
  push:
    tags:
      - 'patient-app-v*'

jobs:
  quality_gate:
    name: Typecheck, Token Lint & Tests
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - name: Install Monorepo Dependencies & Run Quality Gates
        run: |
          REPO_ROOT=$(git rev-parse --show-toplevel)
          cd "$REPO_ROOT"
          bun install --frozen-lockfile
          bun run --cwd apps/patient-app typecheck
          bun run --cwd apps/patient-app lint:tokens
          bun run --cwd apps/patient-app test

  fingerprint:
    name: Calculate Native Fingerprints (Production)
    needs: [quality_gate]
    type: fingerprint
    environment: production
    env:
      APP_VARIANT: production

  get_android_build:
    name: Check Existing Production Android Build
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  build_android:
    name: Build Production Android (Native Changed)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production
    env:
      APP_VARIANT: production

  update:
    name: Publish Production
    needs: [quality_gate]
    type: update
    environment: production
    env:
      APP_VARIANT: production
    params:
      channel: production
