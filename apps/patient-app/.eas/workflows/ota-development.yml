name: Development OTA Update

defaults:
  tools:
    node: "24.22.1"
    bun: "1.3.14"

on:
  push:
    branches:
      - 'development'

jobs:
  quality_gate:
    name: Typecheck, Token Lint & Tests
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - name: Install Monorepo Dependencies & Run Quality Gates
        run: |
          REPO_ROOT=$(git rev-parse --show-toplevel)
          cd "$REPO_ROOT"
          bun install --frozen-lockfile
          bun run --cwd apps/patient-app typecheck
          bun run --cwd apps/patient-app lint:tokens
          bun run --cwd apps/patient-app test

  update:
    name: Publish Development Branch OTA
    needs: [quality_gate]
    type: update
    environment: development
    params:
      channel: br-development

  update_dev_client:
    name: Publish Dev Client OTA
    needs: [quality_gate]
    type: update
    environment: development
    params:
      channel: dev-development
