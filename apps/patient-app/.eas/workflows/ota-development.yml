name: Development OTA Update

on:
  push:
    branches:
      - 'development'

jobs:
  quality_gate:
    name: Typecheck, Token Lint & Tests
    runs-on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: bun run --cwd apps/patient-app typecheck
      - name: Design Token Check
        run: bun run --cwd apps/patient-app lint:tokens
      - name: Automated Tests
        run: bun run --cwd apps/patient-app test

  update:
    name: Publish Development Branch OTA
    needs: [quality_gate]
    type: update
    environment: development
    params:
      channel: br-development

  update_dev_client:
    name: Publish Dev Client OTA
    needs: [quality_gate]
    type: update
    environment: development
    params:
      channel: dev-development
