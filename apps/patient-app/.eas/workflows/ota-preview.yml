name: Preview OTA Update

defaults:
  tools:
    node: "24.22.1"
    bun: "1.3.14"

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!development'

jobs:
  quality_gate:
    name: Typecheck, Token Lint & Tests
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - name: Install Monorepo Dependencies & Run Quality Gates
        run: |
          REPO_ROOT=$(git rev-parse --show-toplevel)
          cd "$REPO_ROOT"
          bun install --frozen-lockfile
          bun run --cwd apps/patient-app typecheck
          bun run --cwd apps/patient-app lint:tokens
          bun run --cwd apps/patient-app test
      - id: resolve_channel
        name: Resolve Sanitized Per-Branch Channel
        run: |
          REPO_ROOT=$(git rev-parse --show-toplevel)
          cd "$REPO_ROOT"
          CHANNEL=$(APP_BRANCH="${{ github.ref_name || 'preview' }}" bun -e "import getConfig from './apps/patient-app/app.config.ts'; const cfg = getConfig({ projectRoot: 'apps/patient-app', staticConfig: {} }); console.log(cfg.updates?.requestHeaders?.['expo-channel-name'] ?? 'br-preview');")
          set-output channel "$CHANNEL"
    outputs:
      channel: ${{ steps.resolve_channel.outputs.channel }}

  update:
    name: Publish Branch OTA Update
    needs: [quality_gate]
    type: update
    environment: preview
    params:
      channel: ${{ needs.quality_gate.outputs.channel }}
