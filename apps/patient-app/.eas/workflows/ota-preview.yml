name: Preview OTA Update

defaults:
  tools:
    bun: "1.3.14"

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!development'

jobs:
  quality_gate:
    name: Typecheck, Token Lint & Tests
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck, Token Lint & Tests
        run: |
          APP_DIR=$([ -d "apps/patient-app" ] && echo "apps/patient-app" || echo ".")
          [ -d "$APP_DIR/node_modules" ] || [ -d "node_modules" ] || [ -d "../../node_modules" ] || bun install --frozen-lockfile
          bun run --cwd "$APP_DIR" typecheck
          bun run --cwd "$APP_DIR" lint:tokens
          bun run --cwd "$APP_DIR" test
      - id: resolve_channel
        name: Resolve Sanitized Per-Branch Channel
        run: |
          APP_DIR=$([ -d "apps/patient-app" ] && echo "apps/patient-app" || echo ".")
          CHANNEL=$(APP_BRANCH="${{ github.ref_name || 'preview' }}" bun -e "import getConfig from './${APP_DIR}/app.config.ts'; const cfg = getConfig({ projectRoot: '${APP_DIR}', staticConfig: {} }); console.log(cfg.updates?.requestHeaders?.['expo-channel-name'] ?? 'br-preview');")
          set-output channel "$CHANNEL"
    outputs:
      channel: ${{ steps.resolve_channel.outputs.channel }}

  update:
    name: Publish Branch OTA Update
    needs: [quality_gate]
    type: update
    environment: preview
    params:
      channel: ${{ needs.quality_gate.outputs.channel }}
