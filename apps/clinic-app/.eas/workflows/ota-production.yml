name: Production OTA Update

on:
  push:
    tags:
      - 'clinic-app-v*'

jobs:
  quality_gate:
    name: Typecheck, Token Lint & Tests
    runs-on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: bun run --cwd apps/clinic-app typecheck
      - name: Design Token Check
        run: bun run --cwd apps/clinic-app lint:tokens
      - name: Automated Tests
        run: bun run --cwd apps/clinic-app test

  update:
    name: Publish Production
    needs: [quality_gate]
    type: update
    environment: production
    params:
      channel: production
