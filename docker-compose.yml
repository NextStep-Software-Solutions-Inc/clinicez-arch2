version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: clinicez-rabbitmq
    ports:
      - "5672:5672"     # AMQP protocol port
      - "15672:15672"   # Management HTTP UI
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: nextstep-rabbitmq-2o2G
    networks:
      - data-network
      - default
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

networks:
  data-network:
    external: true

volumes:
  rabbitmq_data:
    name: rabbitmq_data
