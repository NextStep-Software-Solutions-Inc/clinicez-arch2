name: Deploy Patient Web (Prod)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/patient-app/**'
      - 'packages/shared-ts/**'
      - 'packages/design-tokens/**'
      - '.github/workflows/deploy-patient-web-prod.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual production deployment'
        required: false
        default: 'Manual production deployment'
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PATIENT_WEB || secrets.VERCEL_PROJECT_ID }}

jobs:
  test-and-typecheck:
    name: Type Check & Verify Patient Web
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Type check patient app
        run: bun run typecheck:patient

  deploy:
    name: Build & Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    needs: test-and-typecheck
    environment: Production
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PATIENT_WEB || secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Vercel Configuration
        id: check-env
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::Patient Web Vercel deployment skipped: VERCEL_PROJECT_ID_PATIENT_WEB (or VERCEL_PROJECT_ID), VERCEL_ORG_ID, or VERCEL_TOKEN secret is not set in repository or environment secrets."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.check-env.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        if: steps.check-env.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.check-env.outputs.configured == 'true'
        run: bun install

      - name: Install Vercel CLI
        if: steps.check-env.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check-env.outputs.configured == 'true'
        working-directory: apps/patient-app
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: steps.check-env.outputs.configured == 'true'
        working-directory: apps/patient-app
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel
        if: steps.check-env.outputs.configured == 'true'
        working-directory: apps/patient-app
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
