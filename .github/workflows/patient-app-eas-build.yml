# Manual fallback for triggering EAS native builds from GitHub Actions.
# Primary CI/CD for OTA updates and automated native builds is handled by
# EAS Workflows (.eas/workflows/ota-update.yml and .eas/workflows/build.yml).
#
# Use this workflow when EAS Workflows infra is unavailable or when an ad-hoc
# build is needed outside the normal git-flow automation.

name: Patient App EAS Build (Manual Fallback)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - preview
          - staging
          - production
      platform:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

defaults:
  run:
    working-directory: packages/PatientAppFE

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  eas-build:
    name: EAS Build (${{ inputs.profile }} / ${{ inputs.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS
        run: |
          eas build \
            --profile ${{ inputs.profile }} \
            --platform ${{ inputs.platform }} \
            --non-interactive
