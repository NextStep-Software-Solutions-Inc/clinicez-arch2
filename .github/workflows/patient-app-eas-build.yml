# Manual fallback for triggering EAS native builds from GitHub Actions.
# Primary CI/CD for OTA updates and automated native builds is handled by
# EAS Workflows (.eas/workflows/ota-update.yml and .eas/workflows/build.yml).
#
# Use this workflow when EAS Workflows infra is unavailable or when an ad-hoc
# build is needed outside the normal git-flow automation.

name: Patient App EAS Build (Manual Fallback)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - preview
          - staging
          - production
      platform:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

defaults:
  run:
    working-directory: packages/patient-app

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  eas-build:
    name: EAS Build (${{ inputs.profile }} / ${{ inputs.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: packages/patient-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS
        run: |
          eas build \
            --profile ${{ inputs.profile }} \
            --platform ${{ inputs.platform }} \
            --non-interactive
