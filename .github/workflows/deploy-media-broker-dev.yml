name: Deploy Media Broker (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'services/media-broker/**'
      - 'deploy/media-broker/**'
      - 'scripts/ci/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-media-broker-dev.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'services/media-broker/**'
      - 'deploy/media-broker/**'
      - 'scripts/ci/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-media-broker-dev.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

env:
  IMAGE_NAME: media-broker
  IMAGE_TAG: dev
  CONTAINER_NAME: media-broker
  DEPLOY_DIR: "/opt/docker-stack/media-broker"
  ENVIRONMENT: Development

concurrency:
  group: deploy-media-broker-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    environment: Development

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/media-broker/Dockerfile
        push: false
        load: true
        tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save Docker image to tar.gz
      run: |
        docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > media-broker.tar.gz
        echo "Image size: $(du -sh media-broker.tar.gz | cut -f1)"

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: media-broker-docker-image
        path: media-broker.tar.gz
        retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: Development
    concurrency:
      group: deploy-media-broker-dev-deploy
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code (for compose file)
      uses: actions/checkout@v7

    - name: Create .env file
      env:
        ASPNETCORE_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        CONNECTION_STRING: ${{ secrets.MEDIA_DB_CONNECTION_STRING || secrets.CONNECTION_STRING }}
        DB_SCHEMA: media
        MEDIA_BROKER_AUTO_MIGRATE: 'true'
        MEDIA_BROKER_AUTO_PROVISION: 'true'
        HUB_URL: ${{ vars.HUB_URL || vars.MESSAGING_HUB_URL || secrets.HUB_URL || secrets.MESSAGING_HUB_URL }}
        MEDIA_HUB_CLIENT_ID: ${{ secrets.MEDIA_HUB_CLIENT_ID || vars.MEDIA_HUB_CLIENT_ID || 'media-broker' }}
        MEDIA_HUB_CLIENT_SECRET: ${{ secrets.MEDIA_HUB_CLIENT_SECRET }}
        MEDIA_HUB_SIGNING_KEY: ${{ secrets.MEDIA_HUB_SIGNING_KEY || secrets.MEDIA_MESSAGING_SIGNING_KEY }}
        LIVEKIT_URL: ${{ secrets.LIVEKIT_URL || vars.LIVEKIT_URL }}
        LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY || vars.LIVEKIT_API_KEY }}
        LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
        CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        DATA_NETWORK: ${{ vars.DATA_NETWORK || 'data-network' }}
        NPM_NETWORK: ${{ vars.NPM_NETWORK || 'npm-default' }}
      run: |
        . scripts/ci/prepare-key-env.sh
        prepare_key_env private MEDIA_HUB_SIGNING_KEY
        if [ -z "$CONNECTION_STRING" ]; then
          echo "::error::MEDIA_DB_CONNECTION_STRING is not configured. Set it as a GitHub secret."
          exit 1
        fi
        for var in HUB_URL MEDIA_HUB_CLIENT_ID MEDIA_HUB_CLIENT_SECRET LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
          if [ -z "$(printenv $var)" ]; then
            echo "::error::$var is not configured. Set the matching GitHub secret or variable."
            exit 1
          fi
        done
        for var in ASPNETCORE_ENVIRONMENT CONNECTION_STRING DB_SCHEMA MEDIA_BROKER_AUTO_MIGRATE MEDIA_BROKER_AUTO_PROVISION \
                   HUB_URL MEDIA_HUB_CLIENT_ID MEDIA_HUB_CLIENT_SECRET MEDIA_HUB_SIGNING_KEY \
                   LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET \
                   IMAGE_NAME IMAGE_TAG CONTAINER_NAME DATA_NETWORK NPM_NETWORK; do
          echo "$var=$(printenv $var)" >> deploy/media-broker/.env
        done

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: media-broker-docker-image

    - name: Ensure deploy directory exists on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: mkdir -p "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

    - name: Transfer Docker image via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: media-broker.tar.gz
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}

    - name: Transfer docker-compose and .env files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "deploy/media-broker/docker-compose.yml,deploy/media-broker/.env"
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}
        strip_components: 2

    - name: Load image and deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          set -e
          cd "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

          echo "==> Ensuring networks exist..."
          DATA_NET=$(grep -E '^DATA_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
          PROXY_NET=$(grep -E '^NPM_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
          docker network inspect "${DATA_NET:-data-network}" >/dev/null 2>&1 || docker network create "${DATA_NET:-data-network}"
          docker network inspect "${PROXY_NET:-npm-default}" >/dev/null 2>&1 || docker network create "${PROXY_NET:-npm-default}"

          echo "==> Loading Docker image..."
          docker load < media-broker.tar.gz

          echo "==> Deploying with docker compose..."
          docker compose up -d --force-recreate

          echo "==> Cleaning up old images..."
          docker image prune -f || true

          echo "==> Verifying container is running..."
          docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "==> Deployment complete!"
