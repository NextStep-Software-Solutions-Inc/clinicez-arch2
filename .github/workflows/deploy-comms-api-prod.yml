name: Deploy Comms API (Prod)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual production deployment'
        required: false
        default: 'Manual production deployment'
        type: string

env:
  IMAGE_NAME: comms-api
  IMAGE_TAG: ${{ github.event.release.tag_name || 'prod' }}
  CONTAINER_NAME: comms-api
  DEPLOY_DIR: /opt/clinicez/apps/comms-api
  ENVIRONMENT: Production

concurrency:
  group: deploy-comms-api-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit Tests & Verify Migrations
    runs-on: ubuntu-latest
    environment: Production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && (
        startsWith(github.event.release.tag_name, 'comms-api-') ||
        startsWith(github.event.release.tag_name, 'comms-api/') ||
        startsWith(github.event.release.tag_name, 'comms-api@')
      ))

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - name: Restore dependencies
      run: dotnet restore services/comms-api/ClinicEz.Comms.Tests/ClinicEz.Comms.Tests.csproj

    - name: Run unit tests
      run: dotnet test services/comms-api/ClinicEz.Comms.Tests/ClinicEz.Comms.Tests.csproj --no-restore

    - name: Install dotnet-ef
      run: dotnet tool install --global dotnet-ef --version 10.0.2

    - name: Verify no pending EF Core model changes
      run: |
        dotnet ef migrations has-pending-model-changes \
          --project services/comms-api/ClinicEz.Comms.Infrastructure \
          --startup-project services/comms-api/ClinicEz.Comms.Api

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    environment: Production

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/comms-api/Dockerfile
        push: false
        load: true
        tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save Docker image to tar.gz
      run: |
        docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > comms-api.tar.gz
        echo "Image size: $(du -sh comms-api.tar.gz | cut -f1)"

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: comms-api-docker-image-prod
        path: comms-api.tar.gz
        retention-days: 1

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: deploy-comms-api-prod-deploy
      cancel-in-progress: false
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && (
        startsWith(github.event.release.tag_name, 'comms-api-') ||
        startsWith(github.event.release.tag_name, 'comms-api/') ||
        startsWith(github.event.release.tag_name, 'comms-api@')
      ))

    steps:
    - name: Checkout code (for compose file)
      uses: actions/checkout@v7

    - name: Create .env file
      env:
        ASPNETCORE_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        ENVIRONMENT_LABEL: prod
        CONNECTION_STRING: ${{ secrets.COMMS_DB_CONNECTION_STRING }}
        DB_SCHEMA: comms
        COMMS_AUTO_MIGRATE: 'true'
        COMMS_KEYS_VOLUME: /opt/clinicez/data/comms/keys
        COMMS_STORAGE_VOLUME: /opt/clinicez/data/comms/storage
        HUB_URL: ${{ vars.HUB_URL || vars.MESSAGING_HUB_URL || secrets.HUB_URL || secrets.MESSAGING_HUB_URL }}
        COMMS_HUB_CLIENT_ID: ${{ secrets.COMMS_HUB_CLIENT_ID || secrets.COMMS_MESSAGING_CLIENT_ID }}
        COMMS_HUB_CLIENT_SECRET: ${{ secrets.COMMS_HUB_CLIENT_SECRET || secrets.COMMS_MESSAGING_CLIENT_SECRET }}
        COMMS_HUB_SIGNING_KEY: ${{ secrets.COMMS_HUB_SIGNING_KEY || secrets.COMMS_MESSAGING_SIGNING_KEY }}
        FACILITY_LICENSE_PUBLIC_KEY: ${{ vars.FACILITY_LICENSE_PUBLIC_KEY || secrets.FACILITY_LICENSE_PUBLIC_KEY }}
        FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS: ${{ vars.FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS || secrets.FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS }}
        COMMS_JWT_SIGNING_KEY: ${{ secrets.COMMS_JWT_SIGNING_KEY }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
        CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        BASE_DOMAIN: ${{ secrets.BASE_DOMAIN || vars.BASE_DOMAIN }}
        CORS_ALLOWED_DOMAINS: ${{ vars.CORS_ALLOWED_DOMAINS }}
        CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        DATA_NETWORK: ${{ vars.DATA_NETWORK || 'data-network' }}
        NPM_NETWORK: ${{ vars.NPM_NETWORK || 'npm-default' }}
      run: |
        . scripts/ci/prepare-key-env.sh
        prepare_key_env private COMMS_HUB_SIGNING_KEY
        prepare_key_env public FACILITY_LICENSE_PUBLIC_KEY
        prepare_key_env optional-public FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS
        require_min_length COMMS_JWT_SIGNING_KEY 32
        if [ -z "$CONNECTION_STRING" ]; then
          echo "::error::COMMS_DB_CONNECTION_STRING is not configured. Set it as a GitHub secret."
          exit 1
        fi
        if [ -z "$BASE_DOMAIN" ]; then
          echo "::error::BASE_DOMAIN is not configured. Set it as a GitHub secret or variable."
          exit 1
        fi
        for var in HUB_URL COMMS_HUB_CLIENT_ID COMMS_HUB_CLIENT_SECRET; do
          if [ -z "$(printenv $var)" ]; then
            echo "::error::$var is not configured. Set the matching GitHub secret or variable."
            exit 1
          fi
        done
        for var in ASPNETCORE_ENVIRONMENT ENVIRONMENT_LABEL CONNECTION_STRING DB_SCHEMA COMMS_AUTO_MIGRATE \
                   COMMS_KEYS_VOLUME COMMS_STORAGE_VOLUME \
                   HUB_URL COMMS_HUB_CLIENT_ID COMMS_HUB_CLIENT_SECRET COMMS_HUB_SIGNING_KEY \
                   FACILITY_LICENSE_PUBLIC_KEY FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS COMMS_JWT_SIGNING_KEY \
                   IMAGE_NAME IMAGE_TAG CONTAINER_NAME BASE_DOMAIN CORS_ALLOWED_DOMAINS CORS_ALLOWED_ORIGINS \
                   DATA_NETWORK NPM_NETWORK; do
          echo "$var=$(printenv $var)" >> deploy/comms-api/.env
        done

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: comms-api-docker-image-prod

    - name: Ensure deploy and portable data directories exist on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: mkdir -p "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}" /opt/clinicez/data/comms/keys /opt/clinicez/data/comms/storage

    - name: Transfer Docker image via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: comms-api.tar.gz
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}

    - name: Transfer docker-compose and .env files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "deploy/comms-api/docker-compose.yml,deploy/comms-api/.env"
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}
        strip_components: 2

    - name: Load image and deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          set -e
          cd "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

          echo "==> Ensuring networks exist..."
          DATA_NET=$(grep -E '^DATA_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
          PROXY_NET=$(grep -E '^NPM_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
          docker network inspect "${DATA_NET:-data-network}" >/dev/null 2>&1 || docker network create "${DATA_NET:-data-network}"
          docker network inspect "${PROXY_NET:-npm-default}" >/dev/null 2>&1 || docker network create "${PROXY_NET:-npm-default}"

          echo "==> Loading Docker image..."
          docker load < comms-api.tar.gz

          echo "==> Deploying with docker compose..."
          docker compose up -d --force-recreate

          echo "==> Cleaning up tarball and old images..."
          rm -f comms-api.tar.gz
          docker image prune -f || true

          echo "==> Verifying container is running..."
          docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "==> Comms API Production deployment complete!"
