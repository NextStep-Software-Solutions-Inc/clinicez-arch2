name: Deploy v1 Sync API (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'services/v1-sync-api/**'
      - 'deploy/v1-sync-api/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-v1-sync-api-dev.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'services/v1-sync-api/**'
      - 'deploy/v1-sync-api/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-v1-sync-api-dev.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

env:
  IMAGE_NAME: v1-sync-api
  IMAGE_TAG: dev
  CONTAINER_NAME: v1-sync-api
  DEPLOY_DIR: /opt/docker-stack/v1-sync-api

concurrency:
  group: deploy-v1-sync-api-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Unit & PG17 Integration Tests
    runs-on: ubuntu-latest
    environment: Development
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: clinicez_local
          POSTGRES_PASSWORD: clinicez_local_dev_password
          POSTGRES_DB: postgres
        ports:
          - 5439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore & test v1-sync-api
        env:
          V1SYNC_TEST_PG_HOST: 127.0.0.1
          V1SYNC_TEST_PG_PORT: 5439
          V1SYNC_TEST_PG_USER: clinicez_local
          V1SYNC_TEST_PG_PASSWORD: clinicez_local_dev_password
        run: dotnet test services/v1-sync-api/ClinicEz.V1Sync.Tests/ClinicEz.V1Sync.Tests.csproj

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    environment: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/v1-sync-api/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image to tar.gz
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > v1-sync-api.tar.gz
          echo "Image size: $(du -sh v1-sync-api.tar.gz | cut -f1)"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1-sync-api-docker-image
          path: v1-sync-api.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: Development
    concurrency:
      group: deploy-v1-sync-api-dev-deploy
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code (for compose file)
        uses: actions/checkout@v7

      - name: Create .env file
        env:
          # Run ASPNETCORE_ENVIRONMENT=Development on remote dev so Scalar API docs (/scalar/v1) are available.
          # docker-compose.yml explicitly enforces V1Sync__AllowUnauthenticatedLocalDev=false and clears
          # Track3Storage__*__ServiceUrl + sets Region=auto so remote dev always uses Cloudflare R2 (never MinIO).
          ASPNETCORE_ENVIRONMENT: Development
          ENVIRONMENT_LABEL: dev
          V1_SYNC_ENVIRONMENT_LABEL: DEV
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DATA_NETWORK: ${{ vars.DATA_NETWORK || 'data-network' }}
          NPM_NETWORK: ${{ vars.NPM_NETWORK || 'npm-default' }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN || vars.BASE_DOMAIN }}
          CORS_ALLOWED_DOMAINS: ${{ vars.CORS_ALLOWED_DOMAINS }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CLERK_AUTHORITY: ${{ vars.PORTAL_CLERK_AUTHORITY || secrets.PORTAL_CLERK_AUTHORITY || 'https://amazing-mosquito-75.clerk.accounts.dev' }}
          CLERK_AUTHORIZED_PARTIES: ${{ vars.CLERK_AUTHORIZED_PARTIES }}
          PORTAL_API_BASE_URL: ${{ vars.V1_SYNC_PORTAL_API_BASE_URL || 'http://portal-api:8080' }}
          V1_SOURCE_CONNECTION_STRING: ${{ secrets.V1_SOURCE_CONNECTION_STRING }}
          CLINIC_DB_CONNECTION_STRING: ${{ secrets.CLINIC_DB_CONNECTION_STRING || secrets.CLINICAPP_DB_CONNECTION_STRING }}
          PATIENT_DB_CONNECTION_STRING: ${{ secrets.PATIENT_DB_CONNECTION_STRING }}
          SYNC_LEDGER_DB_CONNECTION_STRING: ${{ secrets.SYNC_LEDGER_DB_CONNECTION_STRING }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLINIC_R2_ACCOUNT_ID: ${{ secrets.CLINIC_R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          CLINIC_R2_BUCKET_NAME: ${{ secrets.CLINIC_R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}
          CLINIC_R2_ACCESS_KEY_ID: ${{ secrets.CLINIC_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          CLINIC_R2_SECRET_ACCESS_KEY: ${{ secrets.CLINIC_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          PATIENT_R2_ACCOUNT_ID: ${{ secrets.PATIENT_R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          PATIENT_R2_BUCKET_NAME: ${{ secrets.PATIENT_R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}
          PATIENT_R2_ACCESS_KEY_ID: ${{ secrets.PATIENT_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          PATIENT_R2_SECRET_ACCESS_KEY: ${{ secrets.PATIENT_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          CLINIC_ENCRYPTION_MASTER_SECRET: ${{ secrets.CLINIC_ENCRYPTION_MASTER_SECRET }}
          CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_0: ${{ secrets.CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_0 }}
          CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_1: ${{ secrets.CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_1 }}
          # Matches patient-api Development fallback when PATIENT_ENCRYPTION_MASTER_SECRET is not explicitly overridden.
          PATIENT_ENCRYPTION_MASTER_SECRET: ${{ secrets.PATIENT_ENCRYPTION_MASTER_SECRET || 'dev-patient-encryption-master-secret-32chars-min-ok!' }}
          PATIENT_ENCRYPTION_PREVIOUS_MASTER_SECRET_0: ${{ secrets.PATIENT_ENCRYPTION_PREVIOUS_MASTER_SECRET_0 }}
          PATIENT_ENCRYPTION_PREVIOUS_MASTER_SECRET_1: ${{ secrets.PATIENT_ENCRYPTION_PREVIOUS_MASTER_SECRET_1 }}
        run: |
          if [ -z "$BASE_DOMAIN" ]; then
            echo "::error::BASE_DOMAIN is not configured. Set it as a GitHub secret or variable (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          for var in CLINIC_DB_CONNECTION_STRING PATIENT_DB_CONNECTION_STRING CLERK_AUTHORITY CLINIC_R2_ACCOUNT_ID CLINIC_R2_BUCKET_NAME CLINIC_R2_ACCESS_KEY_ID CLINIC_R2_SECRET_ACCESS_KEY PATIENT_R2_ACCOUNT_ID PATIENT_R2_BUCKET_NAME PATIENT_R2_ACCESS_KEY_ID PATIENT_R2_SECRET_ACCESS_KEY; do
            if [ -z "$(printenv $var)" ]; then
              echo "::error::$var is not configured. Set the matching GitHub secret or variable (Settings -> Secrets and variables -> Actions)."
              exit 1
            fi
          done
          if [ -z "$SYNC_LEDGER_DB_CONNECTION_STRING" ]; then
            # Derive CLINICEZ_V1_SYNC_DB on the same Dev PostgreSQL host as CLINIC_DB_CONNECTION_STRING.
            SYNC_LEDGER_DB_CONNECTION_STRING=$(printf '%s' "$CLINIC_DB_CONNECTION_STRING" | sed -E 's/(Database=)[^;]+/\1CLINICEZ_V1_SYNC_DB/I')
            export SYNC_LEDGER_DB_CONNECTION_STRING
            echo "::notice::SYNC_LEDGER_DB_CONNECTION_STRING derived targeting CLINICEZ_V1_SYNC_DB on the Clinic DB host."
          fi
          if [ -z "$V1_SOURCE_CONNECTION_STRING" ]; then
            echo "::warning::V1_SOURCE_CONNECTION_STRING is not configured yet in Development secrets; v1-sync-api will start in Standby until set."
          fi
          for var in ASPNETCORE_ENVIRONMENT ENVIRONMENT_LABEL V1_SYNC_ENVIRONMENT_LABEL IMAGE_NAME IMAGE_TAG CONTAINER_NAME DATA_NETWORK NPM_NETWORK BASE_DOMAIN CORS_ALLOWED_DOMAINS CORS_ALLOWED_ORIGINS CLERK_AUTHORITY CLERK_AUTHORIZED_PARTIES PORTAL_API_BASE_URL V1_SOURCE_CONNECTION_STRING CLINIC_DB_CONNECTION_STRING PATIENT_DB_CONNECTION_STRING SYNC_LEDGER_DB_CONNECTION_STRING R2_ACCOUNT_ID R2_BUCKET_NAME R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CLINIC_R2_ACCOUNT_ID CLINIC_R2_BUCKET_NAME CLINIC_R2_ACCESS_KEY_ID CLINIC_R2_SECRET_ACCESS_KEY PATIENT_R2_ACCOUNT_ID PATIENT_R2_BUCKET_NAME PATIENT_R2_ACCESS_KEY_ID PATIENT_R2_SECRET_ACCESS_KEY CLINIC_ENCRYPTION_MASTER_SECRET CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_0 CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_1 PATIENT_ENCRYPTION_MASTER_SECRET PATIENT_ENCRYPTION_PREVIOUS_MASTER_SECRET_0 PATIENT_ENCRYPTION_PREVIOUS_MASTER_SECRET_1; do
            echo "$var=$(printenv $var)" >> deploy/v1-sync-api/.env
          done

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: v1-sync-api-docker-image

      - name: Ensure deploy directory exists on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: mkdir -p "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

      - name: Transfer Docker image via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: v1-sync-api.tar.gz
          target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}

      - name: Transfer docker-compose and .env files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "deploy/v1-sync-api/docker-compose.yml,deploy/v1-sync-api/.env"
          target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}
          strip_components: 2

      - name: Load image and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"
            chmod 600 .env

            echo "==> Ensuring networks exist..."
            DATA_NET=$(grep -E '^DATA_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
            PROXY_NET=$(grep -E '^NPM_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
            docker network inspect "${DATA_NET:-data-network}" >/dev/null 2>&1 || docker network create "${DATA_NET:-data-network}"
            docker network inspect "${PROXY_NET:-npm-default}" >/dev/null 2>&1 || docker network create "${PROXY_NET:-npm-default}"

            echo "==> Loading Docker image..."
            docker load < v1-sync-api.tar.gz

            echo "==> Deploying with docker compose..."
            docker rm -f clinicez-v1-sync-api 2>/dev/null || true
            docker compose up -d --force-recreate

            echo "==> Cleaning up tarball and old images..."
            rm -f v1-sync-api.tar.gz
            docker image prune -f || true

            echo "==> Verifying container is running..."
            docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "==> Deployment complete!"
