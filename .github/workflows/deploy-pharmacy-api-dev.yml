name: Deploy Pharmacy API (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'services/pharmacy-api/**'
      - 'deploy/pharmacy-api/**'
      - 'scripts/ci/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-pharmacy-api-dev.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'services/pharmacy-api/**'
      - 'deploy/pharmacy-api/**'
      - 'scripts/ci/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-pharmacy-api-dev.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

env:
  IMAGE_NAME: pharmacy-api
  IMAGE_TAG: dev
  CONTAINER_NAME: pharmacy-api
  DEPLOY_DIR: "/opt/docker-stack/pharmacy-api"
  ENVIRONMENT: Development

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    environment: Development

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/pharmacy-api/Dockerfile
        push: false
        load: true
        tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save Docker image to tar.gz
      run: |
        docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > pharmacy-api.tar.gz
        echo "Image size: $(du -sh pharmacy-api.tar.gz | cut -f1)"

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: pharmacy-api-docker-image
        path: pharmacy-api.tar.gz
        retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: Development
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code (for compose file)
      uses: actions/checkout@v4

    - name: Create .env file
      env:
        ASPNETCORE_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        CONNECTION_STRING: ${{ secrets.PHARMACY_DB_CONNECTION_STRING }}
        MESSAGING_HUB_URL: ${{ vars.MESSAGING_HUB_URL || secrets.MESSAGING_HUB_URL }}
        MESSAGING_CLIENT_ID: ${{ secrets.PHARMACY_MESSAGING_CLIENT_ID }}
        MESSAGING_CLIENT_SECRET: ${{ secrets.PHARMACY_MESSAGING_CLIENT_SECRET }}
        MESSAGING_SIGNING_KEY: ${{ secrets.PHARMACY_MESSAGING_SIGNING_KEY }}
        FACILITY_LICENSE_PUBLIC_KEY: ${{ vars.FACILITY_LICENSE_PUBLIC_KEY || secrets.FACILITY_LICENSE_PUBLIC_KEY }}
        FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS: ${{ vars.FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS || secrets.FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS }}
        DATA_NETWORK: ${{ vars.DATA_NETWORK || 'data-network' }}
        NPM_NETWORK: ${{ vars.NPM_NETWORK || 'npm-default' }}
        HANGFIRE_DASHBOARD_PASSWORD: ${{ secrets.PHARMACYAPP_HANGFIRE_PASSWORD || secrets.PHARMACY_HANGFIRE_PASSWORD || secrets.HANGFIRE_PASSWORD }}
        INTERNAL_API_KEY: ${{ secrets.PHARMACY_INTERNAL_API_KEY || secrets.INTERNAL_API_KEY }}
        INTERNAL_API_KEY_PREVIOUS: ${{ secrets.PHARMACY_INTERNAL_API_KEY_PREVIOUS }}
        PHARMACY_JWT_SIGNING_KEY: ${{ secrets.PHARMACY_JWT_SIGNING_KEY }}
        GAMOT_UPSC_SECRET_KEY: ${{ secrets.PHARMACY_GAMOT_UPSC_SECRET_KEY }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
        BASE_DOMAIN: ${{ secrets.BASE_DOMAIN || vars.BASE_DOMAIN }}
        CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        CORS_ALLOWED_DOMAINS: ${{ vars.CORS_ALLOWED_DOMAINS }}
      run: |
        . scripts/ci/prepare-key-env.sh
        prepare_key_env private MESSAGING_SIGNING_KEY
        prepare_key_env public FACILITY_LICENSE_PUBLIC_KEY
        prepare_key_env optional-public FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS
        require_min_length GAMOT_UPSC_SECRET_KEY 32
        require_min_length PHARMACY_JWT_SIGNING_KEY 32
        if [ -z "$BASE_DOMAIN" ]; then
          echo "::error::BASE_DOMAIN is not configured. Set it as a GitHub secret or variable (Settings -> Secrets and variables -> Actions)."
          exit 1
        fi
        for var in MESSAGING_HUB_URL MESSAGING_CLIENT_ID MESSAGING_CLIENT_SECRET; do
          if [ -z "$(printenv $var)" ]; then
            echo "::error::$var is not configured. Set the matching GitHub secret or variable (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
        done
        for var in ASPNETCORE_ENVIRONMENT CONNECTION_STRING MESSAGING_HUB_URL MESSAGING_CLIENT_ID MESSAGING_CLIENT_SECRET HANGFIRE_DASHBOARD_PASSWORD INTERNAL_API_KEY INTERNAL_API_KEY_PREVIOUS PHARMACY_JWT_SIGNING_KEY IMAGE_NAME IMAGE_TAG BASE_DOMAIN DATA_NETWORK NPM_NETWORK MESSAGING_SIGNING_KEY FACILITY_LICENSE_PUBLIC_KEY FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS GAMOT_UPSC_SECRET_KEY CORS_ALLOWED_ORIGINS CORS_ALLOWED_DOMAINS; do
          echo "$var=$(printenv $var)" >> deploy/pharmacy-api/.env
        done

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: pharmacy-api-docker-image

    - name: Ensure deploy directory exists on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: mkdir -p "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

    - name: Transfer Docker image via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: pharmacy-api.tar.gz
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}

    - name: Transfer docker-compose and .env files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "deploy/pharmacy-api/docker-compose.yml,deploy/pharmacy-api/.env"
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}
        strip_components: 2

    - name: Load image and deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          set -e
          cd "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

          echo "==> Ensuring networks exist..."
          DATA_NET=$(grep -E '^DATA_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
          PROXY_NET=$(grep -E '^NPM_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
          docker network inspect "${PROXY_NET:-npm-default}" >/dev/null 2>&1 || docker network create "${PROXY_NET:-npm-default}"
          docker network inspect "${DATA_NET:-data-network}" >/dev/null 2>&1 || docker network create "${DATA_NET:-data-network}"

          echo "==> Loading Docker image..."
          docker load < pharmacy-api.tar.gz

          echo "==> Deploying with docker compose..."
          # One-time migration: remove the container left over from the previous prefixed naming scheme
          docker rm -f clinicez-pharmacy-api 2>/dev/null || true

          docker compose up -d --force-recreate

          echo "==> Cleaning up old images..."
          docker image prune -f

          echo "==> Verifying container is running..."
          docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "==> Deployment complete!"
