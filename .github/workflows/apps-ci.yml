name: Apps CI

on:
  push:
    branches:
      - development
      - main
    paths:
      - 'apps/**'
      - 'packages/shared-ts/**'
      - 'package.json'
      - 'bun.lockb'
      - '.github/workflows/apps-ci.yml'
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'apps/**'
      - 'packages/shared-ts/**'
      - 'package.json'
      - 'bun.lockb'
      - '.github/workflows/apps-ci.yml'
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Lint, Type Check & Build Apps
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check all apps
        run: bun run typecheck:all

      - name: Lint portal web
        run: bun run lint:portal

      - name: Build portal web
        run: bun run build:portal
