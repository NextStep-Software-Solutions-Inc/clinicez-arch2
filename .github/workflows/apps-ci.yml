name: Apps CI

on:
  push:
    branches:
      - development
      - main
    paths:
      - 'apps/**'
      - 'packages/shared-ts/**'
      - 'packages/design-tokens/**'
      - 'packages/comms-sdk/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/check-no-broker.ps1'
      - 'scripts/check-no-turnstile.ps1'
      - '.nvmrc'
      - '.node-version'
      - '.github/workflows/apps-ci.yml'
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'apps/**'
      - 'packages/shared-ts/**'
      - 'packages/design-tokens/**'
      - 'packages/comms-sdk/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/check-no-broker.ps1'
      - 'scripts/check-no-turnstile.ps1'
      - '.nvmrc'
      - '.node-version'
      - '.github/workflows/apps-ci.yml'
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Lint, Type Check & Build Apps
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      - name: Install dependencies
        run: bun install

      - name: Guard against message brokers and portal-to-clinic dependencies
        shell: pwsh
        run: ./scripts/check-no-broker.ps1

      - name: Guard against Cloudflare Turnstile residue
        shell: pwsh
        run: ./scripts/check-no-turnstile.ps1

      - name: Type check all apps and packages
        run: bun run typecheck:all

      - name: Test design tokens
        run: bun run test:tokens

      - name: Comms SDK token and host gates
        run: bun run lint:comms

      - name: Test comms SDK
        run: bun run test:comms

      - name: Patient app token gate
        run: bun run lint:patient-tokens

      - name: Test patient app
        run: bun run test:patient

      - name: Test clinic app
        run: bun run test:clinic

      - name: Test portal web
        run: bun run test:portal

      - name: Test admin web
        run: bun run test:admin

      - name: Clinic app token and host/catalog gates
        run: bun run lint:clinic

      - name: Lint portal web
        run: bun run lint:portal

      - name: Lint admin web
        run: bun run lint:admin

      - name: Build portal web
        run: bun run build:portal

      - name: Build admin web
        run: bun run build:admin

      - name: Build patient web
        run: bun run build:patient-web

      - name: Build clinic web
        run: bun run build:clinic-web
