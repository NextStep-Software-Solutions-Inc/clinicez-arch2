name: Publish Clinic Web Image (On-Prem)

# Builds the clinic web app into a self-contained nginx image for clinics that host everything on their own LAN
# (deploy/docker-compose.onprem.yml). The image carries no environment-specific configuration: the API address and
# options are read from the container's environment at start.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/clinic-app/**'
      - 'packages/shared-ts/**'
      - 'packages/design-tokens/**'
      - 'bun.lock'
      - '.github/workflows/publish-clinic-web-image.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag (optional)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push clinic-web image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/clinic-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/clinic-app/deploy/Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max