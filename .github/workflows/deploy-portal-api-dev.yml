name: Deploy Portal API (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'services/portal-api/**'
      - 'deploy/portal-api/**'
      - 'scripts/ci/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-portal-api-dev.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'services/portal-api/**'
      - 'deploy/portal-api/**'
      - 'scripts/ci/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-portal-api-dev.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

env:
  IMAGE_NAME: portal-api
  IMAGE_TAG: dev
  CONTAINER_NAME: portal-api
  DEPLOY_DIR: /opt/docker-stack/portal-api
  ENVIRONMENT: Development

concurrency:
  group: deploy-portal-api-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    environment: Development

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - name: Restore dependencies
      run: dotnet restore CLINICEZ.sln

    - name: Run unit tests
      run: dotnet test services/portal-api/ClinicEz.Portal.Tests/ClinicEz.Portal.Tests.csproj --no-restore

    - name: Install dotnet-ef
      run: dotnet tool install --global dotnet-ef --version 10.0.2

    - name: Verify no pending EF Core model changes
      working-directory: services/portal-api/ClinicEz.Portal.Infrastructure
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.PORTAL_DB_CONNECTION_STRING }}
      run: dotnet ef migrations has-pending-model-changes --startup-project ../ClinicEz.Portal.Api

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    environment: Development

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/portal-api/Dockerfile
        push: false
        load: true
        tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save Docker image to tar.gz
      run: |
        docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > portal-api.tar.gz
        echo "Image size: $(du -sh portal-api.tar.gz | cut -f1)"

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: portal-api-docker-image
        path: portal-api.tar.gz
        retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: Development
    concurrency:
      group: deploy-portal-api-dev-deploy
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code (for compose file)
      uses: actions/checkout@v7

    - name: Create .env file
      env:
        ASPNETCORE_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        ENVIRONMENT_LABEL: dev
        CONNECTION_STRING: ${{ secrets.PORTAL_DB_CONNECTION_STRING }}
        CLERK_SECRET_KEY: ${{ secrets.PORTAL_CLERK_SECRET_KEY }}
        XENDIT_SECRET_KEY: ${{ secrets.PORTAL_XENDIT_SECRET_KEY }}
        XENDIT_CALLBACK_TOKEN: ${{ secrets.PORTAL_XENDIT_CALLBACK_TOKEN }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
        CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        HUB_URL: ${{ vars.HUB_URL || vars.MESSAGING_HUB_URL || secrets.HUB_URL || secrets.MESSAGING_HUB_URL }}
        PORTAL_HUB_CLIENT_ID: ${{ secrets.PORTAL_HUB_CLIENT_ID || secrets.PORTAL_MESSAGING_CLIENT_ID }}
        PORTAL_HUB_CLIENT_SECRET: ${{ secrets.PORTAL_HUB_CLIENT_SECRET || secrets.PORTAL_MESSAGING_CLIENT_SECRET }}
        PORTAL_HUB_SIGNING_KEY: ${{ secrets.PORTAL_HUB_SIGNING_KEY || secrets.PORTAL_MESSAGING_SIGNING_KEY }}
        FACILITY_LICENSE_PRIVATE_KEY: ${{ secrets.FACILITY_LICENSE_PRIVATE_KEY }}
        FACILITY_LICENSE_PUBLIC_KEY: ${{ vars.FACILITY_LICENSE_PUBLIC_KEY || secrets.FACILITY_LICENSE_PUBLIC_KEY }}
        FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS: ${{ vars.FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS || secrets.FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS }}
        DATA_PROTECTION_CERT_BASE64: ${{ secrets.PORTAL_DATA_PROTECTION_CERT_BASE64 }}
        DATA_PROTECTION_CERT_PASSWORD: ${{ secrets.PORTAL_DATA_PROTECTION_CERT_PASSWORD }}
        DATA_NETWORK: ${{ vars.DATA_NETWORK || 'data-network' }}
        NPM_NETWORK: ${{ vars.NPM_NETWORK || 'npm-default' }}
        HANGFIRE_DASHBOARD_PASSWORD: ${{ secrets.PORTALAPP_HANGFIRE_PASSWORD || secrets.PORTAL_HANGFIRE_PASSWORD || secrets.HANGFIRE_PASSWORD }}
        BASE_DOMAIN: ${{ secrets.BASE_DOMAIN || vars.BASE_DOMAIN }}
        CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        CORS_ALLOWED_DOMAINS: ${{ vars.CORS_ALLOWED_DOMAINS }}
        HUB_PUBLIC_URL: ${{ vars.HUB_PUBLIC_URL || secrets.HUB_PUBLIC_URL }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
        ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL || secrets.ADMIN_BASE_URL }}
        CLERK_AUTHORITY: ${{ vars.PORTAL_CLERK_AUTHORITY || secrets.PORTAL_CLERK_AUTHORITY || 'https://amazing-mosquito-75.clerk.accounts.dev' }}
        CLERK_AUTHORIZED_PARTIES: ${{ vars.CLERK_AUTHORIZED_PARTIES }}
        HUB_CLOUD_CELL_ID: ${{ vars.HUB_CLOUD_CELL_ID }}
        SERVICES_PATIENT_API_URL: ${{ vars.SERVICES_PATIENT_API_URL }}
        WORKSPACE_MAX_OWNED_PER_USER: ${{ vars.WORKSPACE_MAX_OWNED_PER_USER }}
        LAB_UPLOAD_MAX_FILE_BYTES: ${{ vars.LAB_UPLOAD_MAX_FILE_BYTES }}
        LAB_UPLOAD_RATE_LIMIT_PERMITS: ${{ vars.LAB_UPLOAD_RATE_LIMIT_PERMITS }}
        LAB_UPLOAD_RATE_LIMIT_WINDOW_MINUTES: ${{ vars.LAB_UPLOAD_RATE_LIMIT_WINDOW_MINUTES }}
        LICENSING_TTL_DAYS: ${{ vars.LICENSING_TTL_DAYS }}
        LICENSING_GRACE_DAYS: ${{ vars.LICENSING_GRACE_DAYS }}
        LICENSING_RENEW_BEFORE_DAYS: ${{ vars.LICENSING_RENEW_BEFORE_DAYS }}
        BILLING_DEFAULT_PLAN_SLUG: ${{ vars.BILLING_DEFAULT_PLAN_SLUG }}
        BILLING_TRIAL_DAYS: ${{ vars.BILLING_TRIAL_DAYS }}
        CLAIM_TOKEN_SIGNING_KEY: ${{ secrets.CLAIM_TOKEN_SIGNING_KEY || secrets.PORTAL_HUB_CLIENT_SECRET }}
        MEDIATR_LICENSE_KEY: ${{ secrets.MEDIATR_LICENSE_KEY || vars.MEDIATR_LICENSE_KEY }}
      run: |
        . scripts/ci/prepare-key-env.sh
        prepare_key_env private PORTAL_HUB_SIGNING_KEY
        prepare_key_env private FACILITY_LICENSE_PRIVATE_KEY
        prepare_key_env public FACILITY_LICENSE_PUBLIC_KEY
        prepare_key_env optional-public FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS
        prepare_key_env optional-blob DATA_PROTECTION_CERT_BASE64
        if [ -z "$BASE_DOMAIN" ]; then
          echo "::error::BASE_DOMAIN is not configured. Set it as a GitHub secret or variable (Settings -> Secrets and variables -> Actions)."
          exit 1
        fi
        for var in HUB_URL PORTAL_HUB_CLIENT_ID PORTAL_HUB_CLIENT_SECRET CLERK_AUTHORITY HUB_PUBLIC_URL CONNECTION_STRING CLERK_SECRET_KEY XENDIT_SECRET_KEY XENDIT_CALLBACK_TOKEN CLAIM_TOKEN_SIGNING_KEY; do
          if [ -z "$(printenv $var)" ]; then
            echo "::error::$var is not configured. Set the matching GitHub secret or variable (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
        done
        for var in ASPNETCORE_ENVIRONMENT ENVIRONMENT_LABEL CONNECTION_STRING CLERK_SECRET_KEY XENDIT_SECRET_KEY XENDIT_CALLBACK_TOKEN IMAGE_NAME IMAGE_TAG CONTAINER_NAME DATA_NETWORK NPM_NETWORK HANGFIRE_DASHBOARD_PASSWORD BASE_DOMAIN HUB_URL PORTAL_HUB_CLIENT_ID PORTAL_HUB_CLIENT_SECRET HUB_PUBLIC_URL SMTP_USER SMTP_PASSWORD FRONTEND_BASE_URL ADMIN_BASE_URL CLERK_AUTHORITY CLERK_AUTHORIZED_PARTIES HUB_CLOUD_CELL_ID SERVICES_PATIENT_API_URL WORKSPACE_MAX_OWNED_PER_USER LAB_UPLOAD_MAX_FILE_BYTES LAB_UPLOAD_RATE_LIMIT_PERMITS LAB_UPLOAD_RATE_LIMIT_WINDOW_MINUTES LICENSING_TTL_DAYS LICENSING_GRACE_DAYS LICENSING_RENEW_BEFORE_DAYS BILLING_DEFAULT_PLAN_SLUG BILLING_TRIAL_DAYS PORTAL_HUB_SIGNING_KEY FACILITY_LICENSE_PRIVATE_KEY FACILITY_LICENSE_PUBLIC_KEY FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS DATA_PROTECTION_CERT_BASE64 DATA_PROTECTION_CERT_PASSWORD CORS_ALLOWED_ORIGINS CORS_ALLOWED_DOMAINS CLAIM_TOKEN_SIGNING_KEY MEDIATR_LICENSE_KEY; do
          echo "$var=$(printenv $var)" >> deploy/portal-api/.env
        done

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: portal-api-docker-image

    - name: Ensure deploy directory exists on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: mkdir -p "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

    - name: Transfer Docker image via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: portal-api.tar.gz
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}

    - name: Transfer docker-compose and .env files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "deploy/portal-api/docker-compose.yml,deploy/portal-api/.env"
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}
        strip_components: 2

    - name: Load image and deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          set -e
          cd "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

          echo "==> Ensuring networks exist..."
          DATA_NET=$(grep -E '^DATA_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
          PROXY_NET=$(grep -E '^NPM_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
          docker network inspect "${PROXY_NET:-npm-default}" >/dev/null 2>&1 || docker network create "${PROXY_NET:-npm-default}"
          docker network inspect "${DATA_NET:-data-network}" >/dev/null 2>&1 || docker network create "${DATA_NET:-data-network}"

          echo "==> Loading Docker image..."
          docker load < portal-api.tar.gz

          echo "==> Deploying with docker compose..."
          # One-time migration: remove the container left over from the previous prefixed naming scheme
          docker rm -f clinicez-portal-api 2>/dev/null || true

          docker compose up -d --force-recreate

          echo "==> Cleaning up tarball and old images..."
          rm -f portal-api.tar.gz
          docker image prune -f || true

          echo "==> Verifying container is running..."
          docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "==> Deployment complete!"
