name: Deploy Portal API (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'services/portal-api/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-portal-api-dev.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'services/portal-api/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-portal-api-dev.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

env:
  IMAGE_NAME: portal-api
  IMAGE_TAG: dev
  CONTAINER_NAME: portal-api
  DEPLOY_DIR: /opt/docker-stack/portal-api
  ENVIRONMENT: Development

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    environment: Development

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - name: Restore dependencies
      run: dotnet restore CLINICEZ.sln

    - name: Run unit tests
      run: dotnet test services/portal-api/ClinicEz.Portal.Tests/ClinicEz.Portal.Tests.csproj --no-restore

    - name: Install dotnet-ef
      run: dotnet tool install --global dotnet-ef --version 10.0.2

    - name: Try to generate debug migration
      working-directory: services/portal-api/ClinicEz.Portal.Infrastructure
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.PORTAL_DB_CONNECTION_STRING }}
      run: |
        dotnet ef migrations add DebugInspect --startup-project ../ClinicEz.Portal.Api || true
        cat Migrations/*DebugInspect.cs || echo "No debug migration found"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    environment: Development

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/portal-api/Dockerfile
        push: false
        load: true
        tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save Docker image to tar.gz
      run: |
        docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > portal-api.tar.gz
        echo "Image size: $(du -sh portal-api.tar.gz | cut -f1)"

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: portal-api-docker-image
        path: portal-api.tar.gz
        retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: Development
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code (for compose file)
      uses: actions/checkout@v4

    - name: Create .env file
      env:
        ASPNETCORE_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        ENVIRONMENT_LABEL: dev
        CONNECTION_STRING: ${{ secrets.PORTAL_DB_CONNECTION_STRING }}
        CLERK_SECRET_KEY: ${{ secrets.PORTAL_CLERK_SECRET_KEY }}
        CLERK_AUTHORITY: ${{ vars.PORTAL_CLERK_AUTHORITY || secrets.PORTAL_CLERK_AUTHORITY }}
        XENDIT_SECRET_KEY: ${{ secrets.PORTAL_XENDIT_SECRET_KEY }}
        XENDIT_CALLBACK_TOKEN: ${{ secrets.PORTAL_XENDIT_CALLBACK_TOKEN }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
        CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        RABBITMQ_HOST: ${{ vars.RABBITMQ_HOST }}
        RABBITMQ_USERNAME: ${{ vars.RABBITMQ_USERNAME }}
        RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        BASE_DOMAIN: ${{ secrets.BASE_DOMAIN || vars.BASE_DOMAIN }}
        CORS_ALLOWED_DOMAINS: ${{ secrets.CORS_ALLOWED_DOMAINS || vars.CORS_ALLOWED_DOMAINS }}
        CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || vars.CORS_ALLOWED_ORIGINS }}
        CLERK_AUTHORIZED_PARTIES: ${{ secrets.CLERK_AUTHORIZED_PARTIES || vars.CLERK_AUTHORIZED_PARTIES }}
        FACILITY_SUBDOMAIN_CLINIC: ${{ vars.FACILITY_SUBDOMAIN_CLINIC }}
        FACILITY_SUBDOMAIN_LABORATORY: ${{ vars.FACILITY_SUBDOMAIN_LABORATORY }}
        FACILITY_SUBDOMAIN_PHARMACY: ${{ vars.FACILITY_SUBDOMAIN_PHARMACY }}
        FACILITY_SUBDOMAIN_ORGANIZATION: ${{ vars.FACILITY_SUBDOMAIN_ORGANIZATION }}
      run: |
        if [ -z "$BASE_DOMAIN" ]; then
          echo "::error::BASE_DOMAIN is not configured. Set it as a GitHub secret or variable (Settings -> Secrets and variables -> Actions)."
          exit 1
        fi
        for var in ASPNETCORE_ENVIRONMENT ENVIRONMENT_LABEL CONNECTION_STRING CLERK_SECRET_KEY CLERK_AUTHORITY XENDIT_SECRET_KEY XENDIT_CALLBACK_TOKEN IMAGE_NAME IMAGE_TAG CONTAINER_NAME RABBITMQ_HOST RABBITMQ_USERNAME RABBITMQ_PASSWORD BASE_DOMAIN CORS_ALLOWED_DOMAINS CORS_ALLOWED_ORIGINS CLERK_AUTHORIZED_PARTIES FACILITY_SUBDOMAIN_CLINIC FACILITY_SUBDOMAIN_LABORATORY FACILITY_SUBDOMAIN_PHARMACY FACILITY_SUBDOMAIN_ORGANIZATION; do
          echo "$var=$(printenv $var)" >> services/portal-api/.env
        done

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: portal-api-docker-image

    - name: Ensure deploy directory exists on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: mkdir -p "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

    - name: Transfer Docker image via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: portal-api.tar.gz
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}

    - name: Transfer docker-compose and .env files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "services/portal-api/docker-compose.yml,services/portal-api/.env"
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}
        strip_components: 2

    - name: Load image and deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          set -e
          cd "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

          echo "==> Ensuring networks exist..."
          docker network inspect npm-default >/dev/null 2>&1 || docker network create npm-default
          docker network inspect data-network >/dev/null 2>&1 || docker network create data-network

          echo "==> Loading Docker image..."
          docker load < portal-api.tar.gz

          echo "==> Deploying with docker compose..."
          # One-time migration: remove the container left over from the previous prefixed naming scheme
          docker rm -f clinicez-portal-api 2>/dev/null || true

          docker compose up -d --force-recreate

          echo "==> Cleaning up tarball and old images..."
          rm -f portal-api.tar.gz
          docker image prune -f

          echo "==> Verifying container is running..."
          docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "==> Deployment complete!"
