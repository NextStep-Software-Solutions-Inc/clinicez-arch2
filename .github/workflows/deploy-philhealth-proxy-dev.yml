name: Deploy PhilHealth Proxy (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'services/philhealth-proxy/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-philhealth-proxy-dev.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'services/philhealth-proxy/**'
      - 'packages/shared-dotnet/**'
      - '.github/workflows/deploy-philhealth-proxy-dev.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

env:
  IMAGE_NAME: philhealth-proxy
  IMAGE_TAG: dev
  CONTAINER_NAME: philhealth-proxy
  DEPLOY_DIR: "/opt/docker-stack/philhealth-proxy"
  ENVIRONMENT: Development

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    environment: Development

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/philhealth-proxy/Dockerfile
        push: false
        load: true
        tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save Docker image to tar.gz
      run: |
        docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > philhealth-proxy.tar.gz
        echo "Image size: $(du -sh philhealth-proxy.tar.gz | cut -f1)"

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: philhealth-proxy-docker-image
        path: philhealth-proxy.tar.gz
        retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: Development
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code (for compose file)
      uses: actions/checkout@v4

    - name: Create .env file
      env:
        ASPNETCORE_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        PORTAL_API_BASE_URL: ${{ vars.PORTAL_API_BASE_URL || 'http://portal-api:8080' }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
      run: |
        for var in ASPNETCORE_ENVIRONMENT PORTAL_API_BASE_URL IMAGE_NAME IMAGE_TAG; do
          echo "$var=$(printenv $var)" >> services/philhealth-proxy/.env
        done

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: philhealth-proxy-docker-image

    - name: Ensure deploy directory exists on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: mkdir -p "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

    - name: Transfer Docker image via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: philhealth-proxy.tar.gz
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}

    - name: Transfer docker-compose and .env files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "services/philhealth-proxy/docker-compose.yml,services/philhealth-proxy/.env"
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}
        strip_components: 2

    - name: Load image and deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          set -e
          cd "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

          echo "==> Ensuring networks exist..."
          docker network inspect npm-default >/dev/null 2>&1 || docker network create npm-default
          docker network inspect data-network >/dev/null 2>&1 || docker network create data-network

          echo "==> Loading Docker image..."
          docker load < philhealth-proxy.tar.gz

          echo "==> Deploying with docker compose..."
          # One-time migration: remove the container left over from the previous prefixed naming scheme
          docker rm -f clinicez-philhealth-proxy 2>/dev/null || true

          docker compose up -d --force-recreate

          echo "==> Cleaning up old images..."
          docker image prune -f

          echo "==> Verifying container is running..."
          docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "==> Deployment complete!"
