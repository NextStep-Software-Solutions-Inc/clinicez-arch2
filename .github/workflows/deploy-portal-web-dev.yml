name: Deploy Portal Web (Dev / Preview)

on:
  push:
    branches:
      - development
    paths:
      - 'apps/portal-web/**'
      - 'packages/shared-ts/**'
      - 'packages/design-tokens/**'
      - '.github/workflows/deploy-portal-web-dev.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'apps/portal-web/**'
      - 'packages/shared-ts/**'
      - 'packages/design-tokens/**'
      - '.github/workflows/deploy-portal-web-dev.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual development deployment'
        required: false
        default: 'Manual development deployment'
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PORTAL_WEB || secrets.VERCEL_PROJECT_ID }}

jobs:
  test-and-lint:
    name: Lint & Type Check Portal Web
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Type check all apps
        run: bun run typecheck:all

      - name: Lint portal web
        run: bun run lint:portal

  deploy:
    name: Build & Deploy to Vercel (Preview)
    runs-on: ubuntu-latest
    needs: test-and-lint
    environment: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: apps/portal-web
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: apps/portal-web
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel
        working-directory: apps/portal-web
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
