name: Deploy Portal Web (Dev / Preview)

on:
  push:
    branches:
      - development
    paths:
      - 'apps/portal-web/**'
      - 'packages/shared-ts/**'
      - 'packages/design-tokens/**'
      - '.github/workflows/deploy-portal-web-dev.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'apps/portal-web/**'
      - 'packages/shared-ts/**'
      - 'packages/design-tokens/**'
      - '.github/workflows/deploy-portal-web-dev.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual development deployment'
        required: false
        default: 'Manual development deployment'
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PORTAL_WEB || secrets.VERCEL_PROJECT_ID }}

jobs:
  test-and-lint:
    name: Lint & Type Check Portal Web
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Type check all apps
        run: bun run typecheck:all

      - name: Lint portal web
        run: bun run lint:portal

  deploy:
    name: Build & Deploy to Vercel (Preview)
    runs-on: ubuntu-latest
    needs: test-and-lint
    environment: Development
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PORTAL_WEB || secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Vercel Configuration
        id: check-env
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::Portal Web Vercel deployment skipped: VERCEL_PROJECT_ID_PORTAL_WEB (or VERCEL_PROJECT_ID), VERCEL_ORG_ID, or VERCEL_TOKEN secret is not set in repository or environment secrets."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.check-env.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node.js
        if: steps.check-env.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.check-env.outputs.configured == 'true'
        run: bun install

      - name: Install Vercel CLI
        if: steps.check-env.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check-env.outputs.configured == 'true'
        working-directory: apps/portal-web
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: steps.check-env.outputs.configured == 'true'
        working-directory: apps/portal-web
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel
        if: steps.check-env.outputs.configured == 'true'
        working-directory: apps/portal-web
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
