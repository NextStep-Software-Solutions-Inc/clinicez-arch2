name: Deploy PatientApp API to DigitalOcean Droplet (Dev)

on:
  push:
    branches:
      - development
      - patient-app-be/feature/init
    paths:
      - 'packages/PatientApp/**'
      - 'packages/CLINICEZ.Shared/**'
      - '.github/workflows/deploy-patient-app-api-dev.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

env:
  IMAGE_NAME: patientapp-api
  IMAGE_TAG: dev
  CONTAINER_NAME: patientapp-api
  DEPLOY_DIR: /opt/clinicez/patientapp
  ENVIRONMENT: Development

jobs:
  # ─── Job 1: Build Docker Image ────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: packages
          file: packages/PatientApp/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image to tar.gz
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > patientapp-api.tar.gz
          echo "Image size: $(du -sh patientapp-api.tar.gz | cut -f1)"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: patientapp-docker-image
          path: patientapp-api.tar.gz
          retention-days: 1

  # ─── Job 2: Deploy to DigitalOcean Droplet ────────────────────────────────────
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    environment: Development
    needs: build

    steps:
      - name: Checkout code (for compose file)
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: patientapp-docker-image

      - name: Ensure deploy directory exists on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_DROPLET_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          script: mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Transfer Docker image via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_DROPLET_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          source: patientapp-api.tar.gz
          target: ${{ env.DEPLOY_DIR }}

      - name: Transfer docker-compose file via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_DROPLET_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          source: packages/PatientApp/docker-compose.deploy.yml
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 2

      - name: Load image and deploy on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_DROPLET_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          script: |
            set -e
            cd ${{ env.DEPLOY_DIR }}

            echo "==> Loading Docker image..."
            docker load < patientapp-api.tar.gz

            echo "==> Writing .env file..."
            cat > .env << 'ENVEOF'
              ASPNETCORE_ENVIRONMENT=${{ env.ENVIRONMENT }}
              CONNECTION_STRING=${{ secrets.PATIENTAPP_DB_CONNECTION_STRING }}
              REDIS_CONNECTION_STRING=${{ secrets.PATIENTAPP_REDIS_CONNECTION_STRING }}
              CLERK_AUTHORITY=${{ secrets.PATIENTAPP_CLERK_AUTHORITY }}
              R2_ACCOUNT_ID=${{ secrets.PATIENTAPP_R2_ACCOUNT_ID }}
              R2_BUCKET_NAME=${{ secrets.PATIENTAPP_R2_BUCKET_NAME }}
              R2_ACCESS_KEY_ID=${{ secrets.PATIENTAPP_R2_ACCESS_KEY_ID }}
              R2_SECRET_ACCESS_KEY=${{ secrets.PATIENTAPP_R2_SECRET_ACCESS_KEY }}
              R2_PUBLIC_URL=${{ secrets.PATIENTAPP_R2_PUBLIC_URL }}
              HANGFIRE_DASHBOARD_USERNAME=${{ secrets.PATIENTAPP_HANGFIRE_USERNAME }}
              HANGFIRE_DASHBOARD_PASSWORD=${{ secrets.PATIENTAPP_HANGFIRE_PASSWORD }}
              IMAGE_NAME=${{ env.IMAGE_NAME }}
              IMAGE_TAG=${{ env.IMAGE_TAG }}
              ENVEOF

            echo "==> Deploying with docker compose..."
            docker compose -f docker-compose.deploy.yml up -d --force-recreate

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Verifying container is running..."
            docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "==> Deployment complete!"
