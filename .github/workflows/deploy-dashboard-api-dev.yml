name: Deploy Clinic EZ API to DigitalOcean Droplet (Dev)

on:
  push:
    branches:
      - development
    paths:
      - 'Clinic EZ/**'
      - 'Clinic EZ.Shared/**'
      - .github/workflows/deploy-Clinic EZ-api-dev.yml
  pull_request:
    branches:
      - development
    paths:
      - 'Clinic EZ/**'
      - 'Clinic EZ.Shared/**'
      - .github/workflows/deploy-Clinic EZ-api-dev.yml
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

env:
    CONTAINER_NAME: Clinic EZ-api
    IMAGE_TAG: dev
    ENVIRONMENT: Development

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: Development

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Clinic EZ/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.CONTAINER_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    environment: Development
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Deploy to DigitalOcean Droplet
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DO_DROPLET_IP }}
        username: ${{ secrets.DO_DROPLET_USER }}
        key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
        script: |
          # Stop and remove existing container if running
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true

          # Pull the latest image
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.CONTAINER_NAME }}:${{ env.IMAGE_TAG }}

          # Run the new container
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --cpus=0.3 \
            --memory=384m \
            -p 72:8080 \
            -e ASPNETCORE_ENVIRONMENT=${{ env.ENVIRONMENT }} \
            -e ConnectionStrings__DefaultConnection="${{ secrets.Clinic EZ_DB_CONNECTION_STRING }}" \
            --restart unless-stopped \
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.CONTAINER_NAME }}:${{ env.IMAGE_TAG }}