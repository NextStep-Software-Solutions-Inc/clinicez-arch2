name: Deploy Clinic API (Prod)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual production deployment'
        required: false
        default: 'Manual production deployment'
        type: string

env:
  IMAGE_NAME: clinic-api
  IMAGE_TAG: ${{ github.event.release.tag_name || 'prod' }}
  CONTAINER_NAME: clinic-api
  DEPLOY_DIR: /opt/clinicez/apps/clinic-api
  ENVIRONMENT: Production

jobs:
  test:
    name: Run Unit Tests & Verify Migrations
    runs-on: ubuntu-latest
    environment: Production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && (
        startsWith(github.event.release.tag_name, 'clinic-api-') ||
        startsWith(github.event.release.tag_name, 'clinic-api/') ||
        startsWith(github.event.release.tag_name, 'clinic-api@') ||
        startsWith(github.event.release.tag_name, 'clinic-') ||
        startsWith(github.event.release.tag_name, 'v')
      ))

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - name: Restore dependencies
      run: dotnet restore CLINICEZ.sln

    - name: Run unit tests
      run: dotnet test services/clinic-api/ClinicEz.Clinic.Application.Tests/ClinicEz.Clinic.Application.Tests.csproj --no-restore

    - name: Install dotnet-ef
      run: dotnet tool install --global dotnet-ef --version 10.0.2

    - name: Verify no pending EF Core model changes
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=clinic_db;Username=postgres;Password=postgres"
      run: |
        dotnet ef migrations has-pending-model-changes \
          --project services/clinic-api/ClinicEz.Clinic.Infrastructure \
          --startup-project services/clinic-api/ClinicEz.Clinic.Api

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    environment: Production

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: services/clinic-api/Dockerfile
        push: false
        load: true
        tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save Docker image to tar.gz
      run: |
        docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > clinic-api.tar.gz
        echo "Image size: $(du -sh clinic-api.tar.gz | cut -f1)"

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: clinic-api-docker-image-prod
        path: clinic-api.tar.gz
        retention-days: 1

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    environment: Production
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && (
        startsWith(github.event.release.tag_name, 'clinic-api-') ||
        startsWith(github.event.release.tag_name, 'clinic-api/') ||
        startsWith(github.event.release.tag_name, 'clinic-api@') ||
        startsWith(github.event.release.tag_name, 'clinic-') ||
        startsWith(github.event.release.tag_name, 'v')
      ))

    steps:
    - name: Checkout code (for compose file)
      uses: actions/checkout@v7

    - name: Create .env file
      env:
        ASPNETCORE_ENVIRONMENT: ${{ env.ENVIRONMENT }}
        ENVIRONMENT_LABEL: prod
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
        CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        CONNECTION_STRING: ${{ secrets.CLINIC_DB_CONNECTION_STRING || secrets.CLINICAPP_DB_CONNECTION_STRING }}
        DB_SCHEMA: public
        HUB_URL: ${{ vars.HUB_URL || vars.MESSAGING_HUB_URL || secrets.HUB_URL || secrets.MESSAGING_HUB_URL }}
        CLINIC_HUB_CLIENT_ID: ${{ vars.CLINIC_HUB_CLIENT_ID || secrets.CLINIC_HUB_CLIENT_ID || secrets.CLINIC_MESSAGING_CLIENT_ID || 'clinic' }}
        CLINIC_HUB_CLIENT_SECRET: ${{ secrets.CLINIC_HUB_CLIENT_SECRET || secrets.CLINIC_MESSAGING_CLIENT_SECRET }}
        CLINIC_HUB_SIGNING_KEY: ${{ secrets.CLINIC_HUB_SIGNING_KEY || secrets.CLINIC_MESSAGING_SIGNING_KEY }}
        FACILITY_LICENSE_PUBLIC_KEY: ${{ vars.FACILITY_LICENSE_PUBLIC_KEY || secrets.FACILITY_LICENSE_PUBLIC_KEY }}
        FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS: ${{ vars.FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS || secrets.FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS }}
        HANGFIRE_DASHBOARD_PASSWORD: ${{ secrets.CLINICAPP_HANGFIRE_PASSWORD || secrets.CLINIC_HANGFIRE_PASSWORD || secrets.HANGFIRE_PASSWORD }}
        PHARMACY_API_URL: ${{ vars.PHARMACY_API_URL || 'http://pharmacy-api:8080' }}
        CLINIC_JWT_SIGNING_KEY: ${{ secrets.CLINIC_JWT_SIGNING_KEY }}
        CLINIC_PUBLIC_UPLOAD_BASE_URL: ${{ vars.CLINIC_PUBLIC_UPLOAD_BASE_URL || secrets.CLINIC_PUBLIC_UPLOAD_BASE_URL }}
        STORAGE_PROVIDER: ${{ vars.CLINIC_STORAGE_PROVIDER || 'R2' }}
        STORAGE_ENABLE_LOCAL_FALLBACK: ${{ vars.CLINIC_STORAGE_LOCAL_FALLBACK || 'true' }}
        R2_ACCOUNT_ID: ${{ secrets.CLINIC_R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        R2_BUCKET_NAME: ${{ secrets.CLINIC_R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}
        R2_ACCESS_KEY_ID: ${{ secrets.CLINIC_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.CLINIC_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
        R2_PUBLIC_URL: ${{ secrets.CLINIC_R2_PUBLIC_URL || secrets.R2_PUBLIC_URL }}
        CLINIC_ENCRYPTION_MASTER_SECRET: ${{ secrets.CLINIC_ENCRYPTION_MASTER_SECRET }}
        DOCUMENT_SIGNING_KEY: ${{ secrets.CLINIC_DOCUMENT_SIGNING_KEY }}
        CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_0: ${{ secrets.CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_0 }}
        CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_1: ${{ secrets.CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_1 }}
        PHILHEALTH_PROXY_URL: ${{ vars.PHILHEALTH_PROXY_URL || 'http://philhealth-proxy:8080' }}
        BASE_DOMAIN: ${{ secrets.BASE_DOMAIN || vars.BASE_DOMAIN }}
        CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        CORS_ALLOWED_DOMAINS: ${{ vars.CORS_ALLOWED_DOMAINS || 'clinicez.net,nextstep-software.com' }}
        DATA_NETWORK: ${{ vars.DATA_NETWORK || 'data-network' }}
        NPM_NETWORK: ${{ vars.NPM_NETWORK || 'npm-default' }}
      run: |
        . scripts/ci/prepare-key-env.sh
        prepare_key_env private CLINIC_HUB_SIGNING_KEY
        prepare_key_env public FACILITY_LICENSE_PUBLIC_KEY
        prepare_key_env optional-public FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS
        require_min_length CLINIC_ENCRYPTION_MASTER_SECRET 32
        require_min_length DOCUMENT_SIGNING_KEY 32
        require_min_length CLINIC_JWT_SIGNING_KEY 32
        if [ -z "$CONNECTION_STRING" ]; then
          echo "::error::CLINIC_DB_CONNECTION_STRING is not configured. Set it as a GitHub secret (Settings -> Secrets and variables -> Actions)."
          exit 1
        fi
        if [ -z "$BASE_DOMAIN" ]; then
          echo "::error::BASE_DOMAIN is not configured. Set it as a GitHub secret or variable (Settings -> Secrets and variables -> Actions)."
          exit 1
        fi
        for var in HUB_URL CLINIC_HUB_CLIENT_ID CLINIC_HUB_CLIENT_SECRET CLINIC_PUBLIC_UPLOAD_BASE_URL CLINIC_ENCRYPTION_MASTER_SECRET HANGFIRE_DASHBOARD_PASSWORD; do
          if [ -z "$(printenv $var)" ]; then
            echo "::error::$var is not configured. Set the matching GitHub secret or variable (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
        done
        for var in ASPNETCORE_ENVIRONMENT ENVIRONMENT_LABEL CONNECTION_STRING DB_SCHEMA HUB_URL CLINIC_HUB_CLIENT_ID CLINIC_HUB_CLIENT_SECRET HANGFIRE_DASHBOARD_PASSWORD PHARMACY_API_URL CLINIC_JWT_SIGNING_KEY CLINIC_PUBLIC_UPLOAD_BASE_URL STORAGE_PROVIDER STORAGE_ENABLE_LOCAL_FALLBACK R2_ACCOUNT_ID R2_BUCKET_NAME R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PUBLIC_URL CLINIC_ENCRYPTION_MASTER_SECRET PHILHEALTH_PROXY_URL IMAGE_NAME IMAGE_TAG CONTAINER_NAME BASE_DOMAIN CORS_ALLOWED_DOMAINS DATA_NETWORK NPM_NETWORK CLINIC_HUB_SIGNING_KEY FACILITY_LICENSE_PUBLIC_KEY FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS DOCUMENT_SIGNING_KEY CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_0 CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_1 CORS_ALLOWED_ORIGINS; do
          echo "$var=$(printenv $var)" >> deploy/clinic-api/.env
        done

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: clinic-api-docker-image-prod

    - name: Ensure deploy directory exists on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: mkdir -p "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

    - name: Transfer Docker image via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: clinic-api.tar.gz
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}

    - name: Transfer docker-compose and .env files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "deploy/clinic-api/docker-compose.yml,deploy/clinic-api/.env"
        target: ${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}
        strip_components: 2

    - name: Load image and deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          set -e
          cd "${{ vars.DEPLOY_DIR || env.DEPLOY_DIR }}"

          echo "==> Ensuring networks exist..."
          DATA_NET=$(grep -E '^DATA_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
          PROXY_NET=$(grep -E '^NPM_NETWORK=' .env 2>/dev/null | cut -d= -f2- | tr -d '\r"')
          docker network inspect "${DATA_NET:-data-network}" >/dev/null 2>&1 || docker network create "${DATA_NET:-data-network}"
          docker network inspect "${PROXY_NET:-npm-default}" >/dev/null 2>&1 || docker network create "${PROXY_NET:-npm-default}"

          echo "==> Loading Docker image..."
          docker load < clinic-api.tar.gz

          echo "==> Deploying with docker compose..."
          # One-time migration: remove the container left over from the previous prefixed naming scheme
          docker rm -f clinicez-clinic-api 2>/dev/null || true

          docker compose up -d --force-recreate

          echo "==> Cleaning up tarball and old images..."
          rm -f clinic-api.tar.gz
          docker image prune -f || true

          echo "==> Verifying container is running..."
          docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "==> Clinic API Production deployment complete!"
