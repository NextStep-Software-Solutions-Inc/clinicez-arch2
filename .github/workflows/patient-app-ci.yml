name: Patient App CI

on:
  push:
    branches:
      - development
      - main
    paths:
      - 'packages/PatientAppFE/**'
      - '.github/workflows/patient-app-ci.yml'
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'packages/PatientAppFE/**'
      - '.github/workflows/patient-app-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/PatientAppFE

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run typecheck
