name: Patient App CI

on:
  push:
    branches:
      - development
      - main
    paths:
      - 'packages/patient-app/**'
      - '.github/workflows/patient-app-ci.yml'
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'packages/patient-app/**'
      - '.github/workflows/patient-app-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/patient-app

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: packages/patient-app/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript type check
        run: yarn typecheck
