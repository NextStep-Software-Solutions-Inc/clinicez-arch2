# docker-compose.yml
# Deploy compose for Clinic API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: clinic-api

services:
  clinic-api:
    image: ${IMAGE_NAME:-clinic-api}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-clinic-api}
    labels:
      - "project=clinicez"
      - "environment=${ENVIRONMENT_LABEL:-prod}"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    # Proportional Resource Allocation (Production VPS 1 vCPU / 2GB RAM Standard)
    # Work-conserving: active services burst to 100% of CPU and available RAM; zero idle resources wasted.
    cpu_shares: ${CLINIC_CPU_SHARES:-1536}
    deploy:
      resources:
        reservations:
          cpus: '${CLINIC_CPUS_RESERVATION:-0.20}'
          memory: ${CLINIC_MEM_RESERVATION:-160M}
        limits:
          cpus: '${CLINIC_CPUS_LIMIT:-0.95}'
          memory: ${CLINIC_MEM_LIMIT:-450M}
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # Low-memory & 1 vCPU tuning for Production VPS (130.94.50.27)
      - DOTNET_GCHeapHardLimitPercent=75
      - DOTNET_gcServer=0
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING:?CONNECTION_STRING must be set}
      - DbSchema=${DB_SCHEMA:-public}
      # Interop hub (the cell hub this clinic's outbox ships to and its inbox polls). No built-in fallback credentials.
      - Messaging__Transport=Hub
      - Messaging__Service=clinic
      - Messaging__HubUrl=${HUB_URL:?HUB_URL must be set}
      - Messaging__ClientId=${CLINIC_HUB_CLIENT_ID:?CLINIC_HUB_CLIENT_ID must be set}
      - Messaging__ClientSecret=${CLINIC_HUB_CLIENT_SECRET:?CLINIC_HUB_CLIENT_SECRET must be set}
      # Envelope signing (ECDSA P-256 private key, PEM or base64 of PEM; scripts/generate-signing-key.sh). Its public half must be
      # the key registered at the hub for this client. One key pair per client; never shared.
      - Messaging__SigningKey=${CLINIC_HUB_SIGNING_KEY:?CLINIC_HUB_SIGNING_KEY must be set}

      # Facility license PUBLIC key (ECDSA P-256, PEM or base64 of PEM; scripts/generate-license-keys.sh). Required: there is no
      # built-in default. The previous public key is only set during a rotation, until every issued license was renewed.
      - FacilityLicense__PublicKeyPem=${FACILITY_LICENSE_PUBLIC_KEY:?FACILITY_LICENSE_PUBLIC_KEY must be set}
      - FacilityLicense__PreviousPublicKeyPem=${FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS:-}
      # Public, absolute base URL of the upload page printed on lab slips ({base}/{token}). Required to issue lab orders.
      - Clinic__PublicUploadBaseUrl=${CLINIC_PUBLIC_UPLOAD_BASE_URL:?CLINIC_PUBLIC_UPLOAD_BASE_URL must be set}
      # Hangfire dashboard Basic Auth password. Required (there is no default).
      - Hangfire__DashboardPassword=${HANGFIRE_DASHBOARD_PASSWORD:?HANGFIRE_DASHBOARD_PASSWORD must be set}
      - Facility__BaseDomain=${BASE_DOMAIN:?BASE_DOMAIN must be set}
      # Extra exact CORS origins (comma separated, * wildcards allowed). Optional: https://<BASE_DOMAIN> and its subdomains are always allowed.
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - Services__PharmacyApiUrl=${PHARMACY_API_URL:-http://pharmacy-api:8080}
      # Signs this service's facility-local session tokens: a long random secret (at least 32 characters), required.
      - Jwt__SigningKey=${CLINIC_JWT_SIGNING_KEY:?CLINIC_JWT_SIGNING_KEY must be set (at least 32 characters)}
      - Jwt__KeyDirectory=/app/keys
      # PhilHealth proxy (PhilHealth Konsulta transmittals). The default only works when it runs on the same Docker network.
      - PhilHealthProxy__BaseUrl=${PHILHEALTH_PROXY_URL:-http://philhealth-proxy:8080}
      # Encrypted scanned records and attachments live on a volume (the default path is inside the container).
      - Storage__BasePath=/app/storage/records
      # Master secret wrapping the per-file encryption keys. Required (no built-in fallback): set it once and never change it
      # afterwards, because files written under another secret can no longer be opened. Back it up with the records.
      - ClinicEncryption__MasterSecret=${CLINIC_ENCRYPTION_MASTER_SECRET:?CLINIC_ENCRYPTION_MASTER_SECRET must be set}
      # Rotation (not automatic, see docs/deployment-configuration.md): previous master secrets stay readable. Optional, empty = none.
      - ClinicEncryption__PreviousMasterSecrets__0=${CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_0:-}
      - ClinicEncryption__PreviousMasterSecrets__1=${CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_1:-}
      # HMAC key of the document digests (verification QR codes): a long random secret, required, no built-in fallback.
      - Documents__SigningKey=${DOCUMENT_SIGNING_KEY:?DOCUMENT_SIGNING_KEY must be set}
      - Cors__AllowedDomains=${CORS_ALLOWED_DOMAINS:-dev.clinicez.net,clinicez.net,dev.nextstep-software.com,nextstep-software.com}
    volumes:
      - clinic-api-keys:/app/keys
      - clinic-records:/app/storage/records
    restart: unless-stopped

volumes:
  clinic-api-keys:
  clinic-records:

networks:
  data-network:
    external: true
    name: ${DATA_NETWORK:-data-network}
  npm-default:
    external: true
    name: ${NPM_NETWORK:-npm-default}
