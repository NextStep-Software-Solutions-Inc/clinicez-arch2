# docker-compose.yml: ClinicEZ on-premise "Edge Cell" bundle (one tenant, one site).
#
# Run it through ./install.sh (Linux/macOS) or ./install.ps1 (Windows). The installer writes .env and
# hub-bootstrap.env next to this file and picks the compose profiles (COMPOSE_PROFILES in .env).
# Manual use:  docker compose up -d      (reads .env, including COMPOSE_PROFILES)
#
# What always runs:      postgres, backup, billing-api, clinic-api, clinic-web
# Profile local-hub:     interop-hub in Local mode (the cell's own hub; ON by default for a cell, see README)
# Profile laboratory:    laboratory-api + laboratory-web
# Profile pharmacy:      pharmacy-api + pharmacy-web
# Profile organization:  organization-api
# Profile cashier:       cashier-web (needs billing-api)
#
# Client model (the installer, .env.example and README describe the same):
#  - Local hub (default): the services use LOCAL clients site-<service> (secrets generated by the installer, declared to the hub
#    in hub-bootstrap.env and given to the services as Messaging__ClientSecret). Messaging__HubUrl = http://interop-hub:8080.
#    Only the local hub holds ONE upstream client (Service 'cell') the portal issued: UPSTREAM_HUB_URL / _CLIENT_ID / _CLIENT_SECRET.
#    UPSTREAM_ENABLED=false (--air-gapped) runs the hub without any upstream: same-cell traffic only.
#  - No local hub (--no-local-hub, single facility): Messaging__HubUrl = MESSAGING_HUB_URL = the CLOUD hub and clinic-api /
#    billing-api use the PORTAL-issued per-service clients CLINIC_HUB_CLIENT_ID/SECRET and BILLING_HUB_CLIENT_ID/SECRET.
#    No UPSTREAM_* then. hub-bootstrap.env is still written (comment-only) because interop-hub references it.
# The only outbound traffic is HTTPS from interop-hub (or the services, without a local hub) and the workspace-profile fetch to
# the cloud. No inbound port.
#
# Every ${VAR:?...} below is interpolated for the whole file, so .env must define all of them (the installer does).

name: clinicez-edge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The aspnet runtime image has no curl/wget: probe /health with bash's /dev/tcp.
x-api-healthcheck: &api-healthcheck
  test:
    - CMD-SHELL
    - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q \" 200 \"'"
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 90s

# Settings every facility API shares (same keys as deploy/*-api/docker-compose.yml in the cloud).
x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Production
  Messaging__Transport: Hub
  # The cell hub (http://interop-hub:8080), or the cloud hub on a single-facility site without a local hub.
  Messaging__HubUrl: ${MESSAGING_HUB_URL:-http://interop-hub:8080}
  Facility__BaseDomain: ${BASE_DOMAIN:-clinic.local}
  # Cloud portal: workspace profile (branding) fetches, cached on disk so the site works offline. May stay empty when air-gapped:
  # the default http://portal.invalid is a deliberately unreachable address (RFC 6761), so the fetch fails fast and the cache or
  # built-in branding is used. (An empty string would not trigger the app's own fallback.)
  Services__PortalApiUrl: ${PORTAL_API_URL:-http://portal.invalid}
  Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
  Hangfire__DashboardPassword: ${HANGFIRE_DASHBOARD_PASSWORD:-}
  Jwt__KeyDirectory: /app/keys
  WorkspaceProfile__CachePath: /app/workspace-profile-cache

services:
  # ---------------------------------------------------------------- data
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinicez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on the first start of an empty data volume: creates every per-service database.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # pg_dump + file backup loop. Writes to BACKUP_DIR (host path: point it at a USB disk / NAS mount), prunes old files.
  # Backup now:   docker compose exec -T backup /bin/bash /backup/backup.sh once
  backup:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-clinicez}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_DATABASES: CLINICEZ_CLINIC_DB CLINICEZ_BILLING_DB CLINICEZ_LABORATORY_DB CLINICEZ_PHARMACY_DB CLINICEZ_ORGANIZATION_DB CLINICEZ_INTEROP_HUB_LOCAL_DB
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backup/backup.sh:/backup/backup.sh:ro
      # File state, read-only: encrypted clinical records and the JWT signing keys.
      - clinic-records:/data/clinic-records:ro
      - clinic-api-keys:/data/keys/clinic-api:ro
      - billing-api-keys:/data/keys/billing-api:ro
      - laboratory-api-keys:/data/keys/laboratory-api:ro
      - pharmacy-api-keys:/data/keys/pharmacy-api:ro
      - organization-api-keys:/data/keys/organization-api:ro

  # ---------------------------------------------------------------- cell hub
  # Same binary as the cloud hub in Local mode. Same-cell traffic stays on the LAN; cross-cell traffic is forwarded to the cloud
  # hub over outbound HTTPS (when UPSTREAM_ENABLED=true; the hub keeps what it could not deliver yet in its outbound queue).
  # The mailboxes live in postgres (database CLINICEZ_INTEROP_HUB_LOCAL_DB).
  # Hub__Bootstrap__* (cell + the LOCAL site-<service> clients + facilities) comes from hub-bootstrap.env, generated by the
  # installer from the same values the services use as Messaging__ClientId / Messaging__ClientSecret. The portal-issued upstream
  # client is NOT part of it: it is Hub__Upstream__* below.
  interop-hub:
    image: ghcr.io/${GHCR_OWNER_REPO:?GHCR_OWNER_REPO must be set}/interop-hub:${IMAGE_TAG:-latest}
    profiles: ["local-hub"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - hub-bootstrap.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=CLINICEZ_INTEROP_HUB_LOCAL_DB;Username=${POSTGRES_USER:-clinicez};Password=${POSTGRES_PASSWORD}
      DbSchema: interop_hub
      Hub__Mode: Local
      Hub__Database__AutoMigrate: "true"
      Hub__LocalCellId: ${EDGE_CELL_ID:?EDGE_CELL_ID must be set}
      # The hub's ONE upstream client (Service 'cell', issued by the portal = HubEdgeCredentials). UPSTREAM_ENABLED=false
      # (air-gapped): no upstream settings are needed; same-cell traffic only, cross-cell/portal/patient messages are rejected
      # with reason upstream_disabled (not queued) and the claims endpoints answer 503. Enabled with empty values: the hub refuses to start.
      Hub__Upstream__Enabled: ${UPSTREAM_ENABLED:-true}
      Hub__Upstream__Url: ${UPSTREAM_HUB_URL:-}
      Hub__Upstream__ClientId: ${UPSTREAM_CLIENT_ID:-}
      Hub__Upstream__ClientSecret: ${UPSTREAM_CLIENT_SECRET:-}
      Hub__PayloadEncryptionKey: ${HUB_PAYLOAD_ENCRYPTION_KEY:-}
    # Optional LAN access to the hub for apps that run outside docker. Loopback only unless HUB_BIND=0.0.0.0.
    ports:
      - "${HUB_BIND:-127.0.0.1}:${HUB_LAN_PORT:-8090}:8080"
    healthcheck:
      <<: *api-healthcheck

  # ---------------------------------------------------------------- always-on APIs
  billing-api:
    image: ghcr.io/${GHCR_OWNER_REPO:?GHCR_OWNER_REPO must be set}/billing-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    # Minimal env, as in deploy/billing-api/docker-compose.yml: billing-api has no Hangfire, no workspace-profile cache and no
    # portal URL, so the shared *api-env block is not used. DbSchema keeps its default (billing).
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=CLINICEZ_BILLING_DB;Username=${POSTGRES_USER:-clinicez};Password=${POSTGRES_PASSWORD}
      Messaging__Transport: Hub
      Messaging__Service: billing
      Messaging__HubUrl: ${MESSAGING_HUB_URL:-http://interop-hub:8080}
      Messaging__ClientId: ${BILLING_HUB_CLIENT_ID:?BILLING_HUB_CLIENT_ID must be set}
      Messaging__ClientSecret: ${BILLING_HUB_CLIENT_SECRET:?BILLING_HUB_CLIENT_SECRET must be set}
      Facility__BaseDomain: ${BASE_DOMAIN:-clinic.local}
      # Provisioning key: lets the portal create the first cashier admin. Empty disables it.
      Internal__ApiKey: ${INTERNAL_API_KEY:-}
      Jwt__SigningKey: ${BILLING_JWT_SIGNING_KEY:-}
      Jwt__KeyDirectory: /app/keys
    volumes:
      - billing-api-keys:/app/keys
    healthcheck: *api-healthcheck

  clinic-api:
    image: ghcr.io/${GHCR_OWNER_REPO:?GHCR_OWNER_REPO must be set}/clinic-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=CLINICEZ_CLINIC_DB;Username=${POSTGRES_USER:-clinicez};Password=${POSTGRES_PASSWORD}
      Messaging__Service: clinic
      Messaging__ClientId: ${CLINIC_HUB_CLIENT_ID:?CLINIC_HUB_CLIENT_ID must be set}
      Messaging__ClientSecret: ${CLINIC_HUB_CLIENT_SECRET:?CLINIC_HUB_CLIENT_SECRET must be set}
      Jwt__SigningKey: ${CLINIC_JWT_SIGNING_KEY:-}
      # Public absolute URL of the lab-result upload page printed on lab slips ({base}/{token}). It is a CLOUD page: the site only
      # needs outbound access, results come back through the hub. Without it lab orders cannot be issued.
      Clinic__PublicUploadBaseUrl: ${CLINIC_PUBLIC_UPLOAD_BASE_URL:-}
      # Encrypted scanned records / attachments (LocalClinicStorageService). Default would be inside the container.
      Storage__BasePath: /app/storage/records
      Services__PharmacyApiUrl: http://pharmacy-api:8080
      # Pairwise key for the pharmacy server's Internal__ApiKey. Empty falls back to Internal__ApiKey (same key here).
      Services__PharmacyApiKey: ${PHARMACY_API_KEY:-}
    volumes:
      - clinic-api-keys:/app/keys
      - clinic-records:/app/storage/records
      - clinic-profile-cache:/app/workspace-profile-cache
    healthcheck: *api-healthcheck

  # ---------------------------------------------------------------- optional APIs
  laboratory-api:
    image: ghcr.io/${GHCR_OWNER_REPO:?GHCR_OWNER_REPO must be set}/laboratory-api:${IMAGE_TAG:-latest}
    profiles: ["laboratory"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=CLINICEZ_LABORATORY_DB;Username=${POSTGRES_USER:-clinicez};Password=${POSTGRES_PASSWORD}
      Messaging__Service: laboratory
      Messaging__ClientId: ${LABORATORY_HUB_CLIENT_ID:-}
      Messaging__ClientSecret: ${LABORATORY_HUB_CLIENT_SECRET:-}
      Jwt__SigningKey: ${LABORATORY_JWT_SIGNING_KEY:-}
    volumes:
      - laboratory-api-keys:/app/keys
      - laboratory-profile-cache:/app/workspace-profile-cache
    healthcheck: *api-healthcheck

  pharmacy-api:
    image: ghcr.io/${GHCR_OWNER_REPO:?GHCR_OWNER_REPO must be set}/pharmacy-api:${IMAGE_TAG:-latest}
    profiles: ["pharmacy"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=CLINICEZ_PHARMACY_DB;Username=${POSTGRES_USER:-clinicez};Password=${POSTGRES_PASSWORD}
      Messaging__Service: pharmacy
      Messaging__ClientId: ${PHARMACY_HUB_CLIENT_ID:-}
      Messaging__ClientSecret: ${PHARMACY_HUB_CLIENT_SECRET:-}
      Jwt__SigningKey: ${PHARMACY_JWT_SIGNING_KEY:-}
    volumes:
      - pharmacy-api-keys:/app/keys
      - pharmacy-profile-cache:/app/workspace-profile-cache
    healthcheck: *api-healthcheck

  organization-api:
    image: ghcr.io/${GHCR_OWNER_REPO:?GHCR_OWNER_REPO must be set}/organization-api:${IMAGE_TAG:-latest}
    profiles: ["organization"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=CLINICEZ_ORGANIZATION_DB;Username=${POSTGRES_USER:-clinicez};Password=${POSTGRES_PASSWORD}
      Messaging__Service: organization
      Messaging__ClientId: ${ORGANIZATION_HUB_CLIENT_ID:-}
      Messaging__ClientSecret: ${ORGANIZATION_HUB_CLIENT_SECRET:-}
      Jwt__SigningKey: ${ORGANIZATION_JWT_SIGNING_KEY:-}
    volumes:
      - organization-api-keys:/app/keys
      - organization-profile-cache:/app/workspace-profile-cache
    healthcheck: *api-healthcheck

  # ---------------------------------------------------------------- web apps (nginx, same-origin /api proxy)
  # Native phones/tablets enter http://<this-server>:<web port> as their server address: the nginx in each web image
  # proxies /api/ to its API, so the APIs themselves never need a host port.
  clinic-web:
    image: ghcr.io/${GHCR_OWNER_REPO:?GHCR_OWNER_REPO must be set}/clinic-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CLINIC_WEB_PORT:-8080}:80"
    environment:
      CLINIC_API_UPSTREAM: http://clinic-api:8080
      EXPO_PUBLIC_PORTAL_URL: ${EXPO_PUBLIC_PORTAL_URL:-}
      EXPO_PUBLIC_OFFLINE_GRACE_HOURS: ${EXPO_PUBLIC_OFFLINE_GRACE_HOURS:-}

  laboratory-web:
    image: ghcr.io/${GHCR_OWNER_REPO:?GHCR_OWNER_REPO must be set}/laboratory-web:${IMAGE_TAG:-latest}
    profiles: ["laboratory"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${LABORATORY_WEB_PORT:-8081}:80"
    environment:
      LABORATORY_API_UPSTREAM: http://laboratory-api:8080

  pharmacy-web:
    image: ghcr.io/${GHCR_OWNER_REPO:?GHCR_OWNER_REPO must be set}/pharmacy-web:${IMAGE_TAG:-latest}
    profiles: ["pharmacy"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PHARMACY_WEB_PORT:-8082}:80"
    environment:
      PHARMACY_API_UPSTREAM: http://pharmacy-api:8080

  # The cashier counter (one counter across clinic + lab + pharmacy) talks to billing-api through the same-origin /api proxy
  # (image: apps/cashier-app/deploy/Dockerfile.web; its /config.json publishes EXPO_PUBLIC_BILLING_API_URL, default "/").
  cashier-web:
    image: ghcr.io/${GHCR_OWNER_REPO:?GHCR_OWNER_REPO must be set}/cashier-web:${IMAGE_TAG:-latest}
    profiles: ["cashier"]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CASHIER_WEB_PORT:-8083}:80"
    environment:
      BILLING_API_UPSTREAM: http://billing-api:8080

volumes:
  postgres-data:
  clinic-api-keys:
  clinic-records:
  clinic-profile-cache:
  billing-api-keys:
  laboratory-api-keys:
  laboratory-profile-cache:
  pharmacy-api-keys:
  pharmacy-profile-cache:
  organization-api-keys:
  organization-profile-cache:
