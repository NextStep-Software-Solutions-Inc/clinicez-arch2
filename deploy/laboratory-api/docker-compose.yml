# docker-compose.yml
# Deploy compose for Laboratory API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: laboratory-api

services:
  laboratory-api:
    image: ${IMAGE_NAME:-laboratory-api}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-laboratory-api}
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      # Interop hub (the cell hub this service's outbox ships to and its inbox polls). No built-in fallback credentials.
      - Messaging__Transport=Hub
      - Messaging__Service=laboratory
      - Messaging__HubUrl=${MESSAGING_HUB_URL:?MESSAGING_HUB_URL must be set}
      - Messaging__ClientId=${MESSAGING_CLIENT_ID:?MESSAGING_CLIENT_ID must be set}
      - Messaging__ClientSecret=${MESSAGING_CLIENT_SECRET:?MESSAGING_CLIENT_SECRET must be set}
      # Hangfire dashboard Basic Auth password. Empty denies the dashboard to everyone (there is no default).
      - Hangfire__DashboardPassword=${HANGFIRE_DASHBOARD_PASSWORD:-}
      - Facility__BaseDomain=${BASE_DOMAIN:?BASE_DOMAIN must be set}
      - Internal__ApiKey=${INTERNAL_API_KEY:-}
      - Jwt__SigningKey=${LAB_JWT_SIGNING_KEY:-}
      - Jwt__KeyDirectory=/app/keys
    volumes:
      - laboratory-api-keys:/app/keys
    restart: unless-stopped

volumes:
  laboratory-api-keys:

networks:
  data-network:
    external: true
    name: ${DATA_NETWORK:-data-network}
  npm-default:
    external: true
    name: ${NPM_NETWORK:-npm-default}
