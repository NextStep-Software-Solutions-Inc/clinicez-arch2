# docker-compose.yml
# Deploy compose for Pharmacy API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: pharmacy-api

services:
  pharmacy-api:
    image: ${IMAGE_NAME:-pharmacy-api}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-pharmacy-api}
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      # Interop hub (the cell hub this service's outbox ships to and its inbox polls). No built-in fallback credentials.
      - Messaging__Transport=Hub
      - Messaging__Service=pharmacy
      - Messaging__HubUrl=${MESSAGING_HUB_URL:?MESSAGING_HUB_URL must be set}
      - Messaging__ClientId=${MESSAGING_CLIENT_ID:?MESSAGING_CLIENT_ID must be set}
      - Messaging__ClientSecret=${MESSAGING_CLIENT_SECRET:?MESSAGING_CLIENT_SECRET must be set}
      # Envelope signing (ECDSA P-256 private key, PEM or base64 of PEM; scripts/generate-signing-key.sh). Its public half must be
      # the key registered at the hub for this client (Messaging__ClientId). One key pair per client; never shared.
      - Messaging__SigningKey=${MESSAGING_SIGNING_KEY:?MESSAGING_SIGNING_KEY must be set}
      # Facility license PUBLIC key (ECDSA P-256, PEM or base64 of PEM; scripts/generate-license-keys.sh). Required: there is no
      # built-in default. The previous public key is only set during a rotation, until every issued license was renewed.
      - FacilityLicense__PublicKeyPem=${FACILITY_LICENSE_PUBLIC_KEY:?FACILITY_LICENSE_PUBLIC_KEY must be set}
      - FacilityLicense__PreviousPublicKeyPem=${FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS:-}
      # Hangfire dashboard Basic Auth password. Empty denies the dashboard to everyone (there is no default).
      - Hangfire__DashboardPassword=${HANGFIRE_DASHBOARD_PASSWORD:-}
      - Facility__BaseDomain=${BASE_DOMAIN:?BASE_DOMAIN must be set}
      # Extra exact CORS origins (comma separated, * wildcards allowed). Optional: https://<BASE_DOMAIN> and its subdomains are always allowed.
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - Cors__AllowedDomains=${CORS_ALLOWED_DOMAINS:-}
      - Internal__ApiKey=${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      # Only set during a key rotation: the old key stays accepted until callers are switched, then remove it.
      - Internal__PreviousApiKey=${INTERNAL_API_KEY_PREVIOUS:-}
      # Signs this service's facility-local session tokens: a long random secret (at least 32 characters), required.
      - Jwt__SigningKey=${PHARMACY_JWT_SIGNING_KEY:?PHARMACY_JWT_SIGNING_KEY must be set (at least 32 characters)}
      - Jwt__KeyDirectory=/app/keys
      # Key behind the UPSC codes of the GAMOT module (at least 32 characters, required, no built-in fallback). Changing it
      # invalidates the codes issued under the old key.
      - Gamot__UpscSecretKey=${GAMOT_UPSC_SECRET_KEY:?GAMOT_UPSC_SECRET_KEY must be set (at least 32 characters)}
    volumes:
      - pharmacy-api-keys:/app/keys
    restart: unless-stopped

volumes:
  pharmacy-api-keys:

networks:
  data-network:
    external: true
    name: ${DATA_NETWORK:-data-network}
  npm-default:
    external: true
    name: ${NPM_NETWORK:-npm-default}
