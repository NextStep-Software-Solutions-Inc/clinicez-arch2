# docker-compose.yml
# Deploy compose for Patient API on Server (Dev environment).
#
# - PostgreSQL: external (managed PostgreSQL or internal postgres)
# - Redis:      external (managed Redis or internal redis)
# - API:        this file manages only the patient-api container
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: patient-api

services:
  patient-api:
    image: ${IMAGE_NAME:-patient-api}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-patient-api}
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING}
      - Clerk__Authority=${CLERK_AUTHORITY:-https://amazing-mosquito-75.clerk.accounts.dev}
      - Clerk__Audience=${CLERK_AUDIENCE:-}
      - Clerk__WebhookSecret=${CLERK_WEBHOOK_SECRET}
      - R2__AccountId=${R2_ACCOUNT_ID}
      - R2__BucketName=${R2_BUCKET_NAME}
      - R2__AccessKeyId=${R2_ACCESS_KEY_ID}
      - R2__SecretAccessKey=${R2_SECRET_ACCESS_KEY}
      - R2__PublicUrl=${R2_PUBLIC_URL}
      - Hangfire__DashboardPassword=${HANGFIRE_DASHBOARD_PASSWORD:-}
      - Firebase__ServiceAccountJson=${FIREBASE_SERVICE_ACCOUNT_JSON}
      # Interop hub (the cell hub this service's outbox ships to and its inbox polls). No built-in fallback credentials.
      - Messaging__Transport=Hub
      - Messaging__Service=patient
      - Messaging__HubUrl=${MESSAGING_HUB_URL:?MESSAGING_HUB_URL must be set}
      - Messaging__ClientId=${MESSAGING_CLIENT_ID:?MESSAGING_CLIENT_ID must be set}
      - Messaging__ClientSecret=${MESSAGING_CLIENT_SECRET:?MESSAGING_CLIENT_SECRET must be set}
      - Facility__BaseDomain=${BASE_DOMAIN:?BASE_DOMAIN must be set}
      # Signs the share tokens patients hand to facilities (at least 32 characters; the service refuses to start without it).
      - Sharing__SigningKey=${SHARING_SIGNING_KEY:?SHARING_SIGNING_KEY must be set (at least 32 characters)}
    restart: unless-stopped

networks:
  data-network:
    external: true
    name: ${DATA_NETWORK:-data-network}
  npm-default:
    external: true
    name: ${NPM_NETWORK:-npm-default}
