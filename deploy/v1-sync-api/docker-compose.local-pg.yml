services:
  clinicez-local-pg17:
    image: pgvector/pgvector:pg17
    container_name: clinicez-local-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicez_local
      POSTGRES_PASSWORD: clinicez_local_dev_password
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - clinicez_local_pg17_data:/var/lib/postgresql/data
      - ./init-local-dbs.sql:/docker-entrypoint-initdb.d/01-init-local-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicez_local -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  clinicez_local_pg17_data:
