# docker-compose.yml
# Deploy compose for v1 Migration & Sync API on Server (Dev / Prod).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: v1-sync-api

services:
  v1-sync-api:
    image: ${IMAGE_NAME:-v1-sync-api}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-v1-sync-api}
    labels:
      - "project=clinicez"
      - "environment=${ENVIRONMENT_LABEL:-dev}"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    cpu_shares: ${V1_SYNC_CPU_SHARES:-768}
    deploy:
      resources:
        reservations:
          cpus: '${V1_SYNC_CPUS_RESERVATION:-0.10}'
          memory: ${V1_SYNC_MEM_RESERVATION:-128M}
        limits:
          cpus: '${V1_SYNC_CPUS_LIMIT:-0.95}'
          memory: ${V1_SYNC_MEM_LIMIT:-512M}
    environment:
      # Always run Production ASPNETCORE_ENVIRONMENT on remote hosts so appsettings.Development.json
      # local overrides (127.0.0.1 MinIO / AllowUnauthenticatedLocalDev) can never leak remotely.
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_GCHeapHardLimitPercent=75
      - DOTNET_gcServer=0

      # Environment badge & strict auth enforcement
      - V1Sync__EnvironmentLabel=${V1_SYNC_ENVIRONMENT_LABEL:-DEV}
      - V1Sync__AllowUnauthenticatedLocalDev=false

      # Auth, CORS & Portal RBAC (`manage:migrations`)
      - Clerk__Authority=${CLERK_AUTHORITY:?CLERK_AUTHORITY must be set}
      - Clerk__AuthorizedParties=${CLERK_AUTHORIZED_PARTIES:-}
      - Cors__AllowedDomains=${CORS_ALLOWED_DOMAINS:-}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - Facility__BaseDomain=${BASE_DOMAIN:?BASE_DOMAIN must be set}
      - PortalApi__BaseUrl=${PORTAL_API_BASE_URL:-http://portal-api:8080}

      # Database bootstrap connections (operational tuning lives in SyncLedgerDb -> Settings UI)
      - ConnectionStrings__V1Source=${V1_SOURCE_CONNECTION_STRING:-}
      - ConnectionStrings__ClinicDb=${CLINIC_DB_CONNECTION_STRING:?CLINIC_DB_CONNECTION_STRING must be set}
      - ConnectionStrings__PatientDb=${PATIENT_DB_CONNECTION_STRING:?PATIENT_DB_CONNECTION_STRING must be set}
      - ConnectionStrings__SyncLedgerDb=${SYNC_LEDGER_DB_CONNECTION_STRING:?SYNC_LEDGER_DB_CONNECTION_STRING must be set}

      # Object Storage credentials — reuses existing Clinic & Patient R2/S3 env vars (with shared R2_* fallback)
      - Track3Storage__ClinicR2__ServiceUrl=${CLINIC_S3_SERVICE_URL:-${S3_SERVICE_URL:-}}
      - Track3Storage__ClinicR2__AccountId=${CLINIC_R2_ACCOUNT_ID:-${R2_ACCOUNT_ID:-}}
      - Track3Storage__ClinicR2__BucketName=${CLINIC_R2_BUCKET_NAME:-${R2_BUCKET_NAME:-}}
      - Track3Storage__ClinicR2__AccessKeyId=${CLINIC_R2_ACCESS_KEY_ID:-${R2_ACCESS_KEY_ID:-}}
      - Track3Storage__ClinicR2__SecretAccessKey=${CLINIC_R2_SECRET_ACCESS_KEY:-${R2_SECRET_ACCESS_KEY:-}}
      - Track3Storage__PatientR2__ServiceUrl=${PATIENT_S3_SERVICE_URL:-${S3_SERVICE_URL:-}}
      - Track3Storage__PatientR2__AccountId=${PATIENT_R2_ACCOUNT_ID:-${R2_ACCOUNT_ID:-}}
      - Track3Storage__PatientR2__BucketName=${PATIENT_R2_BUCKET_NAME:-${R2_BUCKET_NAME:-}}
      - Track3Storage__PatientR2__AccessKeyId=${PATIENT_R2_ACCESS_KEY_ID:-${R2_ACCESS_KEY_ID:-}}
      - Track3Storage__PatientR2__SecretAccessKey=${PATIENT_R2_SECRET_ACCESS_KEY:-${R2_SECRET_ACCESS_KEY:-}}

      # Envelope Encryption Master Secrets — reuses exact clinic-api & patient-api secrets
      - ClinicEncryption__MasterSecret=${CLINIC_ENCRYPTION_MASTER_SECRET:-}
      - ClinicEncryption__PreviousMasterSecrets__0=${CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_0:-}
      - ClinicEncryption__PreviousMasterSecrets__1=${CLINIC_ENCRYPTION_PREVIOUS_MASTER_SECRET_1:-}
      - PatientEncryption__MasterSecret=${PATIENT_ENCRYPTION_MASTER_SECRET:-}
      - PatientEncryption__PreviousMasterSecrets__0=${PATIENT_ENCRYPTION_PREVIOUS_MASTER_SECRET_0:-}
      - PatientEncryption__PreviousMasterSecrets__1=${PATIENT_ENCRYPTION_PREVIOUS_MASTER_SECRET_1:-}
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q \" 200 \"'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  data-network:
    external: true
    name: ${DATA_NETWORK:-data-network}
  npm-default:
    external: true
    name: ${NPM_NETWORK:-npm-default}
