services:
  clinicez-local-minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: clinicez-local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clinicez_minio_admin
      MINIO_ROOT_PASSWORD: clinicez_minio_dev_password_123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - clinicez_local_minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /minio/health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && IFS= read -r line <&3 && [[ \"$$line\" == *\" 200 \"* ]]'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - v1-sync-api_default

  clinicez-local-minio-init:
    image: pgsty/mc:latest
    container_name: clinicez-local-minio-init
    depends_on:
      clinicez-local-minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://clinicez-local-minio:9000 clinicez_minio_admin clinicez_minio_dev_password_123 &&
        mc mb --ignore-existing local/clinicez-clinic-local &&
        mc mb --ignore-existing local/clinicez-patient-local
    networks:
      - v1-sync-api_default

volumes:
  clinicez_local_minio_data:

networks:
  v1-sync-api_default:
    external: true
