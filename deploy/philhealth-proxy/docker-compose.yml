# docker-compose.yml
# Deploy compose for PhilHealth Proxy on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: philhealth-proxy

services:
  philhealth-proxy:
    image: ${IMAGE_NAME:-philhealth-proxy}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-philhealth-proxy}
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    # Proportional Resource Allocation (Production VPS 1 vCPU / 2GB RAM Standard)
    # Work-conserving: active services burst to 100% of CPU and available RAM; zero idle resources wasted.
    cpu_shares: ${PHILHEALTH_PROXY_CPU_SHARES:-512}
    deploy:
      resources:
        reservations:
          cpus: '${PHILHEALTH_PROXY_CPUS_RESERVATION:-0.05}'
          memory: ${PHILHEALTH_PROXY_MEM_RESERVATION:-60M}
        limits:
          cpus: '${PHILHEALTH_PROXY_CPUS_LIMIT:-0.95}'
          memory: ${PHILHEALTH_PROXY_MEM_LIMIT:-200M}
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      # Low-memory & 1 vCPU tuning for Production VPS (130.94.50.27)
      - DOTNET_GCHeapHardLimitPercent=75
      - DOTNET_gcServer=0
      - PortalApi__BaseUrl=${PORTAL_API_BASE_URL:?PORTAL_API_BASE_URL must be set}
      - MediatR__LicenseKey=${MEDIATR_LICENSE_KEY:-}
    restart: unless-stopped

networks:
  data-network:
    external: true
  npm-default:
    external: true
