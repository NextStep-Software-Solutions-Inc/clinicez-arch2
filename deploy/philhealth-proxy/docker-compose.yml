# docker-compose.yml
# Deploy compose for PhilHealth Proxy on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: philhealth-proxy

services:
  philhealth-proxy:
    image: ${IMAGE_NAME:-philhealth-proxy}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-philhealth-proxy}
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      # Portal API the proxy reads tenant credentials from, and the shared key it presents (X-Internal-Key): the SAME value as the
      # portal's INTERNAL_API_KEY. Both are required (no localhost fallback).
      - PortalApi__BaseUrl=${PORTAL_API_BASE_URL:?PORTAL_API_BASE_URL must be set}
      - Internal__ApiKey=${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      # ASP.NET Data Protection key ring (protects stored per-tenant credentials in memory). Optional: a PFX (base64) and its
      # password encrypt the ring at rest.
      - DataProtection__CertificateBase64=${DATA_PROTECTION_CERT_BASE64:-}
      - DataProtection__CertificatePassword=${DATA_PROTECTION_CERT_PASSWORD:-}
    restart: unless-stopped

networks:
  data-network:
    external: true
  npm-default:
    external: true
