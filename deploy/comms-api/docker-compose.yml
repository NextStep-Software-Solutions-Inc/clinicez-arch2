# docker-compose.yml
# Deploy compose for Comms API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: comms-api

services:
  comms-api:
    image: ${IMAGE_NAME:-comms-api}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-comms-api}
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    # Proportional Resource Allocation (Production VPS 1 vCPU / 2GB RAM Standard)
    # Work-conserving: active services burst to 100% of CPU and available RAM; zero idle resources wasted.
    cpu_shares: ${COMMS_CPU_SHARES:-768}
    deploy:
      resources:
        reservations:
          cpus: '${COMMS_CPUS_RESERVATION:-0.10}'
          memory: ${COMMS_MEM_RESERVATION:-90M}
        limits:
          cpus: '${COMMS_CPUS_LIMIT:-0.95}'
          memory: ${COMMS_MEM_LIMIT:-280M}
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      # Low-memory & 1 vCPU tuning for Production VPS (130.94.50.27)
      - DOTNET_GCHeapHardLimitPercent=75
      - DOTNET_gcServer=0
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - DbSchema=comms
      # Interop hub (the cell hub this service's outbox ships to and its inbox polls). No built-in fallback credentials.
      - Messaging__Transport=Hub
      - Messaging__Service=comms
      - Messaging__HubUrl=${HUB_URL:?HUB_URL must be set}
      - Messaging__ClientId=${COMMS_HUB_CLIENT_ID:?COMMS_HUB_CLIENT_ID must be set}
      - Messaging__ClientSecret=${COMMS_HUB_CLIENT_SECRET:?COMMS_HUB_CLIENT_SECRET must be set}
      # Envelope signing (ECDSA P-256 private key, PEM or base64 of PEM; scripts/generate-signing-key.sh).
      - Messaging__SigningKey=${COMMS_HUB_SIGNING_KEY:?COMMS_HUB_SIGNING_KEY must be set}

      # Facility license PUBLIC key (ECDSA P-256, PEM or base64 of PEM; scripts/generate-license-keys.sh).
      - FacilityLicense__PublicKeyPem=${FACILITY_LICENSE_PUBLIC_KEY:?FACILITY_LICENSE_PUBLIC_KEY must be set}
      - FacilityLicense__PreviousPublicKeyPem=${FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS:-}
      - Facility__BaseDomain=${BASE_DOMAIN:?BASE_DOMAIN must be set}
      # Extra exact CORS origins (comma separated, * wildcards allowed).
      - Cors__AllowedDomains=${CORS_ALLOWED_DOMAINS:-}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      # Signs this service's facility-local session tokens: a long random secret (at least 32 characters), required.
      - Jwt__SigningKey=${COMMS_JWT_SIGNING_KEY:?COMMS_JWT_SIGNING_KEY must be set (at least 32 characters)}
      - Jwt__KeyDirectory=/app/keys
    volumes:
      - comms-api-keys:/app/keys
      - comms-storage:/app/Storage
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q \" 200 \"'"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  comms-api-keys:
  comms-storage:

networks:
  data-network:
    external: true
  npm-default:
    external: true
