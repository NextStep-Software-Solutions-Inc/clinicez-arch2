# RabbitMQ broker for a Clinic EZ server (message bus shared by the API containers on this host).
#
# Use this when booting a NEW server. An existing server that already runs RabbitMQ does not need it.
#
#   1. Make sure the Docker network the API stacks use exists (default name: data-network; set RABBITMQ_NETWORK if yours differs):
#        docker network create data-network
#   2. cp .env.example .env  and set RABBITMQ_PASSWORD
#   3. docker compose -f deploy/rabbitmq/docker-compose.yml up -d
#
# The API containers reach it as host `rabbitmq` (the container name) on the shared network (RABBITMQ_NETWORK), authenticating with
# RABBITMQ_USERNAME / RABBITMQ_PASSWORD - the same two values their own stacks receive (RabbitMq__Username/Password).
# No host port is published for AMQP. The management UI is bound to this server's loopback only; reach it with an
# SSH tunnel (ssh -L 15672:127.0.0.1:15672 <server>) or put it behind your reverse proxy.
#
# The user and password are applied only when the data volume is first created. To change them later use
# `docker exec rabbitmq rabbitmqctl change_password <user> <new password>`, then update the API stacks' secret.

name: rabbitmq

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${RABBITMQ_CONTAINER_NAME:-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-rabbit_admin_node}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - broker

networks:
  broker:
    # An existing network shared with the API stacks; its real name comes from RABBITMQ_NETWORK.
    name: ${RABBITMQ_NETWORK:-data-network}
    external: true

volumes:
  rabbitmq_data:
    name: rabbitmq_data