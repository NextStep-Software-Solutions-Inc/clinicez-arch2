# docker-compose.yml
# Deploy compose for Portal API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: portal-api

services:
  portal-api:
    image: ${IMAGE_NAME:-portal-api}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-portal-api}
    labels:
      - "project=clinicez"
      - "environment=${ENVIRONMENT_LABEL:-prod}"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING:?CONNECTION_STRING must be set}
      - Clerk__SecretKey=${CLERK_SECRET_KEY:?CLERK_SECRET_KEY must be set}
      # Clerk issuer the API validates tokens against (JWKS). Required outside Development.
      - Clerk__Authority=${CLERK_AUTHORITY:?CLERK_AUTHORITY must be set}
      # Extra trusted token origins (comma separated). https://<BASE_DOMAIN> and https://*.<BASE_DOMAIN> are added automatically.
      - Clerk__AuthorizedParties=${CLERK_AUTHORIZED_PARTIES:-}
      - Xendit__SecretKey=${XENDIT_SECRET_KEY:?XENDIT_SECRET_KEY must be set}
      - Xendit__CallbackToken=${XENDIT_CALLBACK_TOKEN:?XENDIT_CALLBACK_TOKEN must be set}
      # Interop hub (the cell hub this service's outbox ships to and its inbox polls). No built-in fallback credentials.
      - Messaging__Transport=Hub
      - Messaging__Service=portal
      - Messaging__HubUrl=${MESSAGING_HUB_URL:?MESSAGING_HUB_URL must be set}
      - Messaging__ClientId=${MESSAGING_CLIENT_ID:?MESSAGING_CLIENT_ID must be set}
      - Messaging__ClientSecret=${MESSAGING_CLIENT_SECRET:?MESSAGING_CLIENT_SECRET must be set}
      # Envelope signing (ECDSA P-256 private key, PEM or base64 of PEM; scripts/generate-signing-key.sh). Its public half must be
      # the key registered at the hub for this client (Messaging__ClientId). One key pair per client; never shared.
      - Messaging__SigningKey=${MESSAGING_SIGNING_KEY:?MESSAGING_SIGNING_KEY must be set}
      # Hangfire dashboard Basic Auth password. Empty denies the dashboard to everyone (there is no default).
      - Hangfire__DashboardPassword=${HANGFIRE_DASHBOARD_PASSWORD:-}
      - Facility__BaseDomain=${BASE_DOMAIN:?BASE_DOMAIN must be set}
      # Extra exact CORS origins (comma separated, * wildcards allowed). Optional: https://<BASE_DOMAIN> and its subdomains are always allowed.
      - Cors__AllowedDomains=${CORS_ALLOWED_DOMAINS:-}
      # Public base URL of the cloud hub, handed to on-premise sites with their credentials (Hub:PublicUrl).
      - Hub__PublicUrl=${HUB_PUBLIC_URL:?HUB_PUBLIC_URL must be set}
      # Cell hosting every shared-cloud facility. Must equal the cloud hub's Hub__CloudCellId.
      - Hub__CloudCellId=${HUB_CLOUD_CELL_ID:-cloud}
      # Outgoing mail (the host fails to start without Host and FromEmail). Empty User means no authentication.
      - Smtp__Host=${SMTP_HOST:?SMTP_HOST must be set}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Security=${SMTP_SECURITY:-Auto}
      - Smtp__User=${SMTP_USER:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL must be set}
      - Smtp__FromName=${SMTP_FROM_NAME:-Clinic EZ}
      - Smtp__ReplyTo=${SMTP_REPLY_TO:-}
      # Recipient of the public contact form. Empty disables it.
      - Notifications__ContactInbox=${NOTIFICATIONS_CONTACT_INBOX:-}
      # Web portal base URL (billing redirects when the request carries no Origin/Referer).
      - FrontendBaseUrl=${FRONTEND_BASE_URL:-}
      # Clinic API the portal calls (provisioning, workspace-level reads).
      - Services__ClinicApiUrl=${SERVICES_CLINIC_API_URL:-http://clinic-api:8080}
      # Workspaces one user may own.
      - Workspace__MaxOwnedPerUser=${WORKSPACE_MAX_OWNED_PER_USER:-1}
      # Public lab-result upload relay limits (allowed content types stay at the code default: pdf, jpeg, png).
      - LabUploads__MaxFileBytes=${LAB_UPLOAD_MAX_FILE_BYTES:-5242880}
      - LabUploads__RateLimitPermits=${LAB_UPLOAD_RATE_LIMIT_PERMITS:-20}
      - LabUploads__RateLimitWindowMinutes=${LAB_UPLOAD_RATE_LIMIT_WINDOW_MINUTES:-10}
      # Facility license lifetime, read-only grace after expiry and renewal lead time (days).
      - Licensing__TtlDays=${LICENSING_TTL_DAYS:-30}
      - Licensing__GraceDays=${LICENSING_GRACE_DAYS:-14}
      - Licensing__RenewBeforeDays=${LICENSING_RENEW_BEFORE_DAYS:-10}
      # Facility license keys (ECDSA P-256, PEM or base64 of PEM; scripts/generate-license-keys.sh). The portal signs licenses with
      # the PRIVATE key (it lives only here) and validates them with the public key. No built-in default keys. The previous public
      # key is only set during a rotation, until every issued license was renewed.
      - FacilityLicense__PrivateKeyPem=${FACILITY_LICENSE_PRIVATE_KEY:?FACILITY_LICENSE_PRIVATE_KEY must be set}
      - FacilityLicense__PublicKeyPem=${FACILITY_LICENSE_PUBLIC_KEY:?FACILITY_LICENSE_PUBLIC_KEY must be set}
      - FacilityLicense__PreviousPublicKeyPem=${FACILITY_LICENSE_PUBLIC_KEY_PREVIOUS:-}
      # Plan catalog (limits, features, prices) stays in appsettings; these select the default plan and trial length.
      - Billing__DefaultPlanSlug=${BILLING_DEFAULT_PLAN_SLUG:-starter}
      - Billing__TrialDays=${BILLING_TRIAL_DAYS:-14}
      # ASP.NET Data Protection key ring (protects stored provider secrets). Key ring XMLs are stored directly in PostgreSQL via EF Core.
      # Optional: CertificateBase64 (+ password) encrypts the ring at rest.
      - DataProtection__CertificateBase64=${DATA_PROTECTION_CERT_BASE64:-}
      - DataProtection__CertificatePassword=${DATA_PROTECTION_CERT_PASSWORD:-}
    restart: unless-stopped

networks:
  data-network:
    external: true
    name: ${DATA_NETWORK:-data-network}
  npm-default:
    external: true
    name: ${NPM_NETWORK:-npm-default}
