# Triggers a full native EAS Build whenever a build is truly needed:
#
#   development         →  development builds for Android + iOS (internal/simulator)
#   main                →  staging builds for Android + iOS (internal)
#   tag v* (from main)  →  production builds for Android + iOS (store)
#   manual              →  any profile / platform via workflow_dispatch
#
# OTA JS-only updates are handled separately in ota-update.yml.

name: Native Build

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
    paths:
      - packages/patient-app/**
      - '!packages/patient-app/**/*.md'
      - '!packages/patient-app/app/**'
      - '!packages/patient-app/components/**'
      - '!packages/patient-app/screens/**'
      - '!packages/patient-app/hooks/**'
      - '!packages/patient-app/stores/**'
      - '!packages/patient-app/services/**'
      - '!packages/patient-app/constants/**'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: 'EAS build profile'
        required: true
        default: staging
        options:
          - development
          - preview
          - staging
          - production
      platform:
        type: choice
        description: 'Target platform'
        required: true
        default: all
        options:
          - all
          - android
          - ios

concurrency:
  cancel_in_progress: false
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  # ── Manual dispatch ───────────────────────────────────────────────────────
  build_manual_android:
    name: 'Build Android (${{ inputs.profile }})'
    type: build
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android') }}
    params:
      platform: android
      profile: ${{ inputs.profile }}
      message: 'Manual build: ${{ inputs.profile }} / android'

  build_manual_ios:
    name: 'Build iOS (${{ inputs.profile }})'
    type: build
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'ios') }}
    params:
      platform: ios
      profile: ${{ inputs.profile }}
      message: 'Manual build: ${{ inputs.profile }} / ios'

  # ── development branch → development builds ─────────────────────────────────
  build_development_android:
    name: 'Build Android (development)'
    type: build
    environment: development
    if: ${{ github.event_name == 'push' && github.ref_name == 'development' }}
    params:
      platform: android
      profile: development
      message: ${{ github.commit_message || '' }}

  build_development_ios:
    name: 'Build iOS (development)'
    type: build
    environment: development
    if: ${{ github.event_name == 'push' && github.ref_name == 'development' }}
    params:
      platform: ios
      profile: development
      message: ${{ github.commit_message || '' }}

  # ── main branch → staging builds ─────────────────────────────────────────
  build_staging_android:
    name: 'Build Android (staging)'
    type: build
    environment: staging
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    params:
      platform: android
      profile: staging
      message: ${{ github.commit_message || '' }}

  build_staging_ios:
    name: 'Build iOS (staging)'
    type: build
    environment: staging
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    params:
      platform: ios
      profile: staging
      message: ${{ github.commit_message || '' }}

  # ── version tag from main → production builds ────────────────────────
  build_production_android:
    name: 'Build Android (production)'
    type: build
    environment: production
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    params:
      platform: android
      profile: production
      message: 'Release ${{ github.ref_name }}'

  build_production_ios:
    name: 'Build iOS (production)'
    type: build
    environment: production
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    params:
      platform: ios
      profile: production
      message: 'Release ${{ github.ref_name }}'
