name: Development OTA Update

on:
  push:
    branches:
      - 'develop'

jobs:
  update:
    name: Publish Development
    environment: development
    steps:
      - name: Check out repository
        uses: eas/checkout
      - name: Setup Bun
        run: npm install -g bun
      - name: Install dependencies
        working_directory: packages/patient-app-bun-56
        run: bun install
      - name: Publish Update
        working_directory: packages/patient-app-bun-56
        run: eas update --profile development --branch development --non-interactive
