name: Production OTA Update

on:
  push:
    tags:
      - '*'

jobs:
  update:
    name: Publish Production
    environment: production
    steps:
      - name: Check out repository
        uses: eas/checkout
      - name: Setup Node.js
        uses: eas/use-node
        with:
          node-version: 22.x
      - name: Setup Bun
        run: npm install -g bun
      - name: Install dependencies
        run: bun install
      - name: Publish Update
        run: eas update --profile production --branch production --non-interactive
