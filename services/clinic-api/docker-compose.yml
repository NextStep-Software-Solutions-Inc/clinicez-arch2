# docker-compose.yml
# Deploy compose for Clinic API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: clinic-api

services:
  clinic-api:
    image: ${IMAGE_NAME:-clinic-api}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-clinic-api}
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Username=${RABBITMQ_USERNAME:-rabbit_admin_node}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      - Facility__BaseDomain=${BASE_DOMAIN:?BASE_DOMAIN must be set}
      - Internal__ApiKey=${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      - Services__PharmacyApiUrl=${PHARMACY_API_URL:-http://pharmacy-api:8080}
      - Jwt__KeyDirectory=/app/keys
    volumes:
      - clinic-api-keys:/app/keys
    restart: unless-stopped

volumes:
  clinic-api-keys:

networks:
  data-network:
    external: true
  npm-default:
    external: true
