# docker-compose.deploy.yml
# Deploy compose for Clinic Dashboard API on DigitalOcean Droplet (Dev environment).

services:
  clinic-dashboard-api:
    image: ${IMAGE_NAME:-clinicez-clinic-dashboard-api}:${IMAGE_TAG:-dev}
    container_name: clinicez-clinic-dashboard-api
    ports:
      - "5300:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - RabbitMq__Host=${RABBITMQ_HOST:-conn-rabbitmq.dev.nextstep-software.com}
      - RabbitMq__Username=${RABBITMQ_USERNAME:-rabbitmq}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-nextstep-rabbitmq-2o2G}
    restart: unless-stopped
