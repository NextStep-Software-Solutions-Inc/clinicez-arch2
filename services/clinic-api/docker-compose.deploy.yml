# docker-compose.deploy.yml
# Deploy compose for Clinic API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.

services:
  clinic-api:
    image: ${IMAGE_NAME:-clinicez-clinic-api}:${IMAGE_TAG:-dev}
    container_name: clinicez-clinic-api
    ports:
      - "5300:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - RabbitMq__Host=${RABBITMQ_HOST}
      - RabbitMq__Username=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
    restart: unless-stopped
