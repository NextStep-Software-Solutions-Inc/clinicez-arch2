# docker-compose.deploy.yml
# Deploy compose for Pharmacy API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via clinicez-net and reverse proxy (NPM).

name: clinicez-pharmacy-api

services:
  pharmacy-api:
    image: ${IMAGE_NAME:-clinicez-pharmacy-api}:${IMAGE_TAG:-dev}
    container_name: clinicez-pharmacy-api
    labels:
      - "project=clinicez"
      - "environment=dev"
    networks:
      - clinicez-net
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - RabbitMq__Host=${RABBITMQ_HOST}
      - RabbitMq__Username=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
    restart: unless-stopped

networks:
  clinicez-net:
    name: clinicez-net
    external: true
