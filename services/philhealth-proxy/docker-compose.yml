# docker-compose.yml
# Deploy compose for PhilHealth Proxy on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: clinicez-philhealth-proxy

services:
  philhealth-proxy:
    image: ${IMAGE_NAME:-clinicez-philhealth-proxy}:${IMAGE_TAG:-dev}
    container_name: clinicez-philhealth-proxy
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - PortalApi__BaseUrl=${PORTAL_API_BASE_URL:-http://clinicez-portal-api:8080}
    restart: unless-stopped

networks:
  data-network:
    external: true
  npm-default:
    external: true
