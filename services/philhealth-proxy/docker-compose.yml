# docker-compose.yml
# Deploy compose for PhilHealth Proxy on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: philhealth-proxy

services:
  philhealth-proxy:
    image: ${IMAGE_NAME:-philhealth-proxy}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-philhealth-proxy}
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
    restart: unless-stopped

networks:
  data-network:
    external: true
  npm-default:
    external: true
