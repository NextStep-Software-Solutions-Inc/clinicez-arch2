# docker-compose.deploy.yml
# Deploy compose for Portal API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.

services:

  # ─── Portal API ──────────────────────────────────────────────────────────
  portal-api:
    image: ${IMAGE_NAME:-clinicez-portal-api}:${IMAGE_TAG:-dev}
    container_name: clinicez-portal-api
    ports:
      - "5200:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - Clerk__SecretKey=${CLERK_SECRET_KEY}
      - Xendit__SecretKey=${XENDIT_SECRET_KEY}
      - Xendit__CallbackToken=${XENDIT_CALLBACK_TOKEN}
      - RabbitMq__Host=${RABBITMQ_HOST}
      - RabbitMq__Username=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
    restart: unless-stopped
