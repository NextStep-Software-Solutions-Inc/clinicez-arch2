# docker-compose.yml
# Deploy compose for Patient API on Server (Dev environment).
#
# - PostgreSQL: external (managed PostgreSQL or internal postgres)
# - Redis:      external (managed Redis or internal redis)
# - API:        this file manages only the patient-api container
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: patient-api

services:
  patient-api:
    image: ${IMAGE_NAME:-patient-api}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-patient-api}
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING}
      - Clerk__Authority=${CLERK_AUTHORITY:-https://amazing-mosquito-75.clerk.accounts.dev}
      - Clerk__Audience=${CLERK_AUDIENCE:-}
      - Clerk__WebhookSecret=${CLERK_WEBHOOK_SECRET}
      - R2__AccountId=${R2_ACCOUNT_ID}
      - R2__BucketName=${R2_BUCKET_NAME}
      - R2__AccessKeyId=${R2_ACCESS_KEY_ID}
      - R2__SecretAccessKey=${R2_SECRET_ACCESS_KEY}
      - R2__PublicUrl=${R2_PUBLIC_URL}
      - Hangfire__DashboardPassword=${HANGFIRE_DASHBOARD_PASSWORD:-changeme}
      - Firebase__ServiceAccountJson=${FIREBASE_SERVICE_ACCOUNT_JSON}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Username=${RABBITMQ_USERNAME:-rabbit_admin_node}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      - Facility__BaseDomain=${BASE_DOMAIN:?BASE_DOMAIN must be set}
    restart: unless-stopped

networks:
  data-network:
    external: true
  npm-default:
    external: true
