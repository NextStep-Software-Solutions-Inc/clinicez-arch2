services:

  # ─── Patient App API ──────────────────────────────────────────────────────────
  patientapp-api:
    build:
      context: ..
      dockerfile: PatientApp/Dockerfile
    container_name: patientapp-api
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=patientapp_db;Username=${POSTGRES_USER:-patientapp};Password=${POSTGRES_PASSWORD:-patientapp_secret}
      - ConnectionStrings__Redis=redis:6379
      - Clerk__Authority=${CLERK_AUTHORITY}
      - Clerk__Audience=${CLERK_AUDIENCE}
      - Clerk__WebhookSecret=${CLERK_WEBHOOK_SECRET}
      - R2__AccountId=${R2_ACCOUNT_ID}
      - R2__BucketName=${R2_BUCKET_NAME}
      - R2__AccessKeyId=${R2_ACCESS_KEY_ID}
      - R2__SecretAccessKey=${R2_SECRET_ACCESS_KEY}
      - R2__PublicUrl=${R2_PUBLIC_URL}
      - Hangfire__DashboardUsername=${HANGFIRE_DASHBOARD_USERNAME:-admin}
      - Hangfire__DashboardPassword=${HANGFIRE_DASHBOARD_PASSWORD:-changeme}
      - Encryption__Enabled=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - patientapp-net
    restart: unless-stopped

  # ─── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: patientapp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: patientapp_db
      POSTGRES_USER: ${POSTGRES_USER:-patientapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patientapp_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patientapp} -d patientapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - patientapp-net
    restart: unless-stopped

  # ─── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: patientapp-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - patientapp-net
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  patientapp-net:
    driver: bridge
