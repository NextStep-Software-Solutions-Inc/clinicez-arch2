# docker-compose.yml
# Deploy compose for Laboratory API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: laboratory-api

services:
  laboratory-api:
    image: ${IMAGE_NAME:-laboratory-api}:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-laboratory-api}
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      data-network:
        aliases:
          - laboratory-api
          - clinicez-laboratory-api
      npm-default:
        aliases:
          - laboratory-api
          - clinicez-laboratory-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - RabbitMq__Host=${RABBITMQ_HOST}
      - RabbitMq__Username=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      - Facility__BaseDomain=${BASE_DOMAIN:?BASE_DOMAIN must be set}
      - Cors__AllowedDomains=${CORS_ALLOWED_DOMAINS:-}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-}
      - Verification__BaseUrl=${VERIFICATION_BASE_URL:-}
    restart: unless-stopped

networks:
  data-network:
    external: true
  npm-default:
    external: true
