# docker-compose.deploy.yml
# Deploy compose for Laboratory API on Server (Dev environment).
#
# All secrets are injected via .env written at deploy time by GitHub Actions.
# No host ports exposed; routed via npm-default (NPM) and connected to data-network.

name: clinicez-laboratory-api

services:
  laboratory-api:
    image: ${IMAGE_NAME:-clinicez-laboratory-api}:${IMAGE_TAG:-dev}
    container_name: clinicez-laboratory-api
    labels:
      - "project=clinicez"
      - "environment=dev"
    expose:
      - "8080"
    networks:
      - data-network
      - npm-default
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - RabbitMq__Host=${RABBITMQ_HOST}
      - RabbitMq__Username=${RABBITMQ_USERNAME}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
    restart: unless-stopped

networks:
  data-network:
    external: true
  npm-default:
    external: true
